/* auto - открыть самой (при загрузке и первом ответе облака); иначе только карточка на главной */
function resumeFromState(auto) {
  const x = state.ses;
  if (sesLive()) { // уже идёт тренировка: если это она же, но на другом устройстве ушла дальше - берём свежее место
    if (x && x.sid && x.sid === ses.sid && ((x.i || 0) > ses.i || ((x.i || 0) === ses.i && x.phase === 'fb' && ses.phase !== 'fb'))) { const s = sesRestore(x); if (s) ses = s; }
    return;
  }

  const s = sesRestore(x); if (!s) return;

  else { ui.tab = 'home'; ui.stack = []; ui.route = { v: 'home' }; } // давняя - карточкой на главной
}
function sesGo() { sesSave(); if (ui.route.v === 'ses') { render(); window.scrollTo(0, 0); } else go({ v: 'ses' }); } // «Ещё 10» - без лишнего шага «назад»
function startPool(title, pool, n, extra = {}) {
  const due = shuffle(pool.filter(id => state.errors[id] && !state.errors[id].learned && state.errors[id].lastOk !== today()));
  const fresh = shuffle(pool.filter(id => itemStatus(id) === 'new'));
  const bad = shuffle(pool.filter(id => itemStatus(id) === 'bad'));
  const ok = pool.filter(id => itemStatus(id) === 'ok').sort((a, b) => lastSeen(a).localeCompare(lastSeen(b)));
  const ids = [...new Set([...due.slice(0, Math.ceil(n / 2)), ...fresh, ...bad, ...ok])].slice(0, n);
  if (!ids.length) { toast('Здесь пока нечего решать'); return; }

}

/* «Все оставшиеся (N)»: ровно те задания темы, что ещё не решены верно (см. restIds) - сначала ошибки, потом новые */
const keyTitle = k => { const [s, t] = String(k).split(':'); return s === 'ru' ? `Задание ${t}` : s === 'ruE' ? `Задание ${t} · как на ЕГЭ` : s === 'en' ? (enSec(t)?.title || 'Английский') : s === 'soc' ? (socTopic(t)?.title || 'Обществознание') : s === 'finw' ? (finWork(t) ? `«${finWork(t).title}»` : 'Произведение') : s === 'fin' ? (FIN_KIND[t] ? `Итоговое: ${FIN_KIND[t]}` : 'Итоговое сочинение') : 'Тренировка'; };
function startRest(key) {
  const ids = restIds(key); if (!ids.length) { toast('В этой теме всё решено верно'); render(); return; }
  const isErr = id => state.errors[id] && !state.errors[id].learned;
  ses = { sid: uid(), title: keyTitle(key) + ' · все оставшиеся', pool: ids, n: ids.length, ids: [...shuffle(ids.filter(isErr)), ...shuffle(ids.filter(id => !isErr(id)))], i: 0, okN: 0, got: 0, newErr: 0, phase: 'q', sel: [], msel: {}, last: null, key, rest: true };

}
/* «Продолжить» (часть 1): вперемешку, как тест ЕГЭ. Номера 1-26 идут по кругу - давно не бывшие в «Продолжить» первыми,
   поэтому все номера выпадают примерно поровну и ударения не чаще других; номер с ошибками на сегодня - вперёд очереди.
   Внутри номера: ошибки на сегодня -> новые -> давно решённые -> исправленные сегодня. Отмеченные «Подтянуть» - до 3 раз за заход.
   Задания по тексту (1-3, 23-26) в одном заходе - по одному тексту, чтобы читать его один раз */
const MIX_N = 15;
const mixPool = (n, T) => [...new Set([...(TASK_ITEMS['ru:' + n] || []), ...(TASK_ITEMS['ruE:' + n] || [])])].filter(id => { const it = ITEMS[id]; return it && (!it.text || it.text === T); });
function mixPick(pool, used) {
  const free = pool.filter(id => !used.has(id)), t = today();
  const due = free.filter(id => state.errors[id] && !state.errors[id].learned && state.errors[id].lastOk !== t);
  const fresh = free.filter(id => itemStatus(id) === 'new');
  const ok = free.filter(id => itemStatus(id) === 'ok').sort((a, b) => lastSeen(a).localeCompare(lastSeen(b)));
  const any = g => g.length ? g[Math.floor(Math.random() * g.length)] : null;

function startMix(N = MIX_N) {
  const TK = Object.keys(RU_TEXTS), T = TK[Math.floor(Math.random() * TK.length)], t = today();
  const nums = []; for (let n = 1; n <= 26; n++) if (mixPool(n, T).length) nums.push(n);
  if (!nums.length) { toast('Здесь пока нечего решать'); return; }
  const seen = state.mixSeen = state.mixSeen || {};
  const hasDue = n => mixPool(n, T).some(id => state.errors[id] && !state.errors[id].learned && state.errors[id].lastOk !== t);
  const wk = n => !!(state.weak?.['ru:' + n] && !state.weak['ru:' + n].done);
  const order = shuffle([...nums]).sort((a, b) => (hasDue(b) - hasDue(a)) || ((seen[a] || 0) - (seen[b] || 0)));
  const W = nums.filter(wk), cp = W.length ? Math.max(1, Math.min(3, Math.floor(N * 0.6 / W.length))) : 0;
  const slots = []; for (const n of W) for (let c = 0; c < cp; c++) slots.push(n);
  for (const n of order) { if (slots.length >= N) break; if (!W.includes(n)) slots.push(n); }
  const used = new Set(), ids = [];
  for (const n of slots.slice(0, N)) { const id = mixPick(mixPool(n, T), used); if (id) { used.add(id); ids.push(id); } }
  if (!ids.length) { toast('Здесь пока нечего решать'); return; }
  const base = Math.max(Date.now(), ...Object.values(seen).map(Number).filter(Number.isFinite)) + 1; [...new Set(slots.slice(0, N))].forEach((n, i) => { seen[n] = base + i; });
  ses = { sid: uid(), title: 'Вперемешку 1-26', pool: [], n: N, ids: shuffle(ids), i: 0, okN: 0, got: 0, newErr: 0, phase: 'q', sel: [], msel: {}, last: null, mix: true };

/* «Начать заново» для незаконченной: та же тренировка с начала, новый набор заданий */
function sesRestart(x) {

/* ================= «Подтянуть»: довести тему до идеала ================= */
const IDEAL = 0.95;

function weakPct(key) { const ids = weakPool(key); let ok = 0, errs = 0; for (const id of ids) { const s = itemStatus(id); if (s === 'ok') ok++; if (state.errors[id] && !state.errors[id].learned) errs++; } return { ok, errs, total: ids.length, pct: ids.length ? ok / ids.length : 0 }; }

const weakShort = key => { const [s, t] = String(key).split(':'); return s === 'ru' ? `задание ${t}` : (s === 'soc' ? socTopic(t)?.title : enSec(t)?.title) || 'тема'; };

    { h: 'Часть 3. Теория Раскольникова', p: `В Петербург приезжают мать и Дуня. Раскольников идёт к следователю **Порфирию Петровичу**. Тот вспоминает статью Раскольникова о преступлении - **теорию о двух разрядах людей**: «обыкновенные» живут по закону, а «необыкновенные», как Наполеон, имеют право «перешагнуть» через кровь ради великой цели. Раскольников хочет проверить себя: **«тварь ли я дрожащая или право имею»**. Порфирий подозревает его. Незнакомый мещанин бросает Раскольникову в лицо: «Убивец!»` },
    { h: 'Часть 4. Соня и Лазарь', p: `К Раскольникову приходит **Свидригайлов** - бывший хозяин Дуни, который её преследовал. Дуня разрывает помолвку с Лужиным. Раскольников приходит к Соне; она читает ему из Евангелия **историю о воскрешении Лазаря**. Он обещает сказать ей, кто убил Лизавету. Во второй встрече Порфирий почти загоняет Раскольникова в угол, но маляр **Миколка неожиданно «признаётся» в убийстве**.` },
    { h: 'Часть 5. Признание Соне', p: `На поминках по Мармеладову **Лужин подбрасывает Соне сто рублей и обвиняет её в краже** - сосед Лебезятников видел это и разоблачает его. Раскольников признаётся Соне в убийстве: **«Я себя убил, а не старушонку!»** Соня советует ему выйти на перекрёсток, поклониться земле и сказать всем: «Я убил», - то есть принять страдание и искупить вину. Катерина Ивановна сходит с ума и умирает.` },
    { h: 'Часть 6. Явка с повинной', p: `Порфирий прямо говорит Раскольникову, что знает правду, и советует явиться с повинной. **Свидригайлов** заманивает Дуню, она стреляет в него, но не убивает; он отпускает её, раздаёт деньги детям Катерины Ивановны и Соне - и **застреливается**. Раскольников прощается с матерью и сестрой, приходит к Соне за крестом, на Сенной площади **кланяется и целует землю** и идёт в контору признаваться.` },
    { h: 'Эпилог. Каторга', p: `Раскольникова отправляют на **каторгу в Сибирь на восемь лет**. **Соня едет за ним**, помогает каторжным, и они её любят, а его нет. Сначала Раскольников не раскаивается, считает себя только «неудавшимся». Во время болезни ему снится сон о моровой язве: люди, уверенные, что только они правы, уничтожают друг друга. Однажды у реки он плачет и обнимает колени Сони - **«их воскресила любовь»**. Начинается его новая жизнь.` },

  kapdoch: [
    { h: 'Главы 1-2. Отъезд и буран', p: `**Пётр Гринёв** - сын отставного офицера. В шестнадцать лет отец отправляет его служить не в Петербург, а в армию, в Оренбург, и даёт наказ: **«Береги платье снову, а честь смолоду»**. С Петром едет старый слуга **Савельич**. В пути он проигрывает в бильярд сто рублей и заставляет Савельича отдать долг.

    { h: 'Главы 6-8. Пугачёв берёт крепость', p: `Начинается **восстание Пугачёва**. Крепость взята. **Комендант и поручик Иван Игнатьич отказываются присягать самозванцу - их вешают**, Василису Егоровну убивают. Гринёва тоже ведут к виселице, но Савельич бросается Пугачёву в ноги - и **Пугачёв, узнав в Гринёве того, кто подарил ему тулуп, милует его**. Оказывается, вожатым в буран был сам Пугачёв. **Швабрин переходит на сторону бунтовщиков.** Машу прячет у себя жена священника.` },
    { h: 'Главы 8-9. «Служить тебе не могу»', p: `Ночью Пугачёв зовёт Гринёва и предлагает служить ему. **Гринёв честно отвечает: «Я природный дворянин; я присягал государыне императрице: тебе служить не могу»**. Пугачёва поражает его прямота, и он отпускает Гринёва в Оренбург. Комендантом крепости Пугачёв оставляет Швабрина.` },
    { h: 'Главы 10-12. Спасение Маши', p: `Оренбург в осаде. Гринёв получает письмо от Маши: **Швабрин держит её взаперти и заставляет выйти за него**. Генерал отказывается помочь, и Гринёв с Савельичем едет сам. Его хватают и приводят к Пугачёву. По дороге Пугачёв рассказывает **калмыцкую сказку об орле и вороне**: ворон живёт триста лет, питаясь падалью, а орёл лучше один раз напьётся живой крови. **Пугачёв освобождает Машу** и отпускает её с Гринёвым, хотя Швабрин выдаёт, что она дочь казнённого коменданта.` },
    { h: 'Главы 13-14. Суд и помилование', p: `Гринёв отправляет Машу к своим родителям, а сам воюет с бунтовщиками. После разгрома восстания его арестовывают по доносу Швабрина как изменника. **На суде Гринёв молчит о Маше**, чтобы её не допрашивали, и ему грозит ссылка в Сибирь.

  voina: [
    { h: 'Том 1. 1805 год', p: `Петербург, салон Анны Павловны Шерер. **Пьер Безухов** - незаконный сын богатого графа, неловкий и добрый. **Князь Андрей Болконский** скучает в свете и уходит на войну, мечтая о славе. Пьер получает огромное наследство и женится на красавице **Элен Курагиной** - пустой и холодной. В Москве - именины у Ростовых: **Наташа** (ей тринадцать лет), её брат Николай, кузина Соня. В имении Лысые Горы живут старый князь Болконский и его дочь **княжна Марья**.

    { h: 'Том 2. 1806-1812', p: `Пьер **стреляется на дуэли с Долоховым** - любовником жены, ранит его и расходится с Элен; ищет смысл жизни у масонов. Князь Андрей возвращается домой, его жена умирает при родах. Он живёт в деревне, разочарованный. По дороге в Отрадное видит **старый дуб** - мёртвый, без листьев; ночью слышит, как Наташа у окна восхищается луной; на обратном пути **дуб уже в листве** - и князь Андрей понимает: «жизнь не кончена в 31 год».

    { h: 'Том 3. 1812 год, Бородино', p: `Наполеон вторгается в Россию. Старый князь Болконский умирает; богучаровские мужики не выпускают княжну Марью - её выручает **Николай Ростов**. Главнокомандующим становится **Кутузов**.
**Бородинское сражение**: Пьер в белой шляпе на батарее Раевского видит, как простые солдаты спокойно идут на смерть. **Князь Андрей смертельно ранен** - на перевязочном пункте видит раненого Анатоля и прощает его. Москву оставляют. **Наташа заставляет родителей отдать подводы раненым**, бросив вещи. Узнав, что раненый Андрей едет с ними, она ухаживает за ним. Пьер остаётся в горящей Москве, хочет убить Наполеона, **спасает девочку из пожара**, заступается за женщину - и попадает в плен.` },
    { h: 'Том 4. Народная война', p: `Князь Андрей перед смертью **прощает Наташу** и умирает. В плену Пьер видит расстрел пленных и знакомится с солдатом **Платоном Каратаевым** - тот учит его жить просто и радоваться малому. При отступлении французов **Каратаева расстреливают**, а Пьера освобождают партизаны. Идёт **партизанская война** - «дубина народной войны»; в бою гибнет юный **Петя Ростов**. Кутузов не гонится за славой, бережёт армию - Толстой противопоставляет его Наполеону: **«Нет величия там, где нет простоты, добра и правды»**. Элен умирает.` },

    { h: 'История Мастера и Маргариты', p: `В клинике Иван знакомится с **Мастером**. Историк выиграл деньги, написал роман о Пилате и встретил **Маргариту** - она несла жёлтые цветы. Критики затравили роман, и **Мастер сжёг рукопись**, а после ложного доноса соседа оказался в клинике. Маргарита, не зная, где он, тоскует.` },

async function packState() {
  const json = backupJSON();
  try {
    if (typeof CompressionStream === 'function') {
      const u = new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
      let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
      return 'EGE1:' + btoa(s);
    }
  } catch {}
  return json;
}
async function unpackText(text) {
  const t = String(text || '').trim();
  if (!t.startsWith('EGE1:')) return t;
  const bin = atob(t.slice(5).replace(/\s+/g, '')), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}

  for (let i = 0; i < 400; i++, k = addDays(k, -1)) { const pl = state.days[k]?.pl; if (full(pl)) n++; else if (!rest(pl)) break; }
  return n;
}

/* ---- учёт: ответы сегодня по предметам, видам заданий итогового и тренировкам ---- */
const record0 = record;
record = function (it, ok, my) {
  const d = day(), t = d.t = d.t || {}, inc = x => { t[x] = (t[x] || 0) + 1; };
  if (it?.subj) inc(it.subj);
  if (it?.subj === 'fin' && it.task) inc('fin:' + it.task);
  if (ses?.key) inc('s:' + ses.key);
  return record0(it, ok, my);
};
/* письменные шаги: сколько слов было в поле, когда она его открыла сегодня (или меньше всего за день), - новые слова = разница.
   Так засчитывается и написанное заново, и вставленное целиком, а вчерашний текст без новых слов - нет */
document.addEventListener('focusin', e => {
  if (!PLAN_WRITE[e.target?.id]) return;
  const d = day(), lo = d.wl = d.wl || {}; if (lo[e.target.id] == null) { lo[e.target.id] = words(e.target.value); save(); }
});
document.addEventListener('input', e => {
  const W = PLAN_WRITE[e.target?.id]; if (!W) return;
  const n = words(e.target.value), d = day(), lo = d.wl = d.wl || {}, w = d.w = d.w || {};
  lo[e.target.id] = Math.min(lo[e.target.id] ?? n, n);
  if (!w[W[0]] && n >= W[1] && n - lo[e.target.id] >= W[2]) { w[W[0]] = 1; save(); }
});

ICONS.right = '<path d="M9 5l7 7-7 7"/>';

}
function weekHTML() {

}
function progressHTML(ph) {
  const read = finReadWorks(), fixed = read.filter(finDone).length, cov = finCovered().size, g = mainGift(), best = bestMock();
  let ok = 0, tot = 0; for (let n = 1; n <= 26; n++) { const m = mastery('ru:' + n); ok += m.ok; tot += m.total; }
  const ru = tot ? ok / tot : 0, pct = x => Math.round(x * 100) + '%';
  const row = (a, icon, cls, title, meta, val, style = '') => `<button class="prow" ${a}><span class="tnum ${cls}" style="${style}">${ic(icon, 22)}</span><span style="min-width:0"><span class="ttl">${title}</span><br><span class="tmeta">${meta}</span></span><span class="pts num">${val}</span></button>`;
  return `<section class="card"><h2 class="h2">Мой прогресс</h2><div>
    ${ph.id === 'p1' ? row('data-a="tab" data-t="final"', 'pen', '', 'Итоговое сочинение', `прочитано ${read.length}, закреплено ${fixed} · аргументы к ${cov} из ${FIN_T.length} тем`, pct(FIN_T.length ? cov / FIN_T.length : 0)) : ''}
    ${row('data-a="tab" data-t="ru"', 'book', 'theory', 'Русский ЕГЭ', `задания 1-26${best ? ` · лучший пробник ${best} из 28` : ' · пробник ещё впереди'}`, pct(ru))}
    ${ph.id === 'p1' ? '' : row('data-a="tab" data-t="soc"', 'scale', 'theory', 'Обществознание', 'все темы', pct(poolPct(keysOf('soc:'))))}
    ${ph.id === 'p1' ? '' : row('data-a="tab" data-t="en"', 'globe', 'theory', 'Английский', 'все разделы', pct(poolPct(keysOf('en:'))))}
    ${row('data-a="openGifts"', 'gift', '', 'Копилка', g ? `на «${esc(g.title)}» - ${pct(Math.min(1, state.coins / g.cost))}` : 'добавь подарок, на который копишь', rub(state.coins), 'background:var(--gold-soft);color:var(--gold)')}
  </div></section>`;
}
function moreHTML() {
  const un = errList().filter(e => !e.learned).length, lastEssay = state.essays[0]?.result?.total, open = ui.finOpen?.['home-more'];
  return `<details class="more" data-fd="home-more" ${open ? 'open' : ''}><summary>Ещё: быстрые тренировки, обещания, вехи</summary><div class="stack">

    <section class="card"><h2 class="h2">Путь к 100: русский по блокам</h2>
      <p class="muted small" style="margin:0">100 баллов - это все 50 первичных: 28 за тест и 22 за сочинение. Цель для каждого блока - 90% и выше.</p>
      ${BLOCK_MAP.map(([name, ns]) => { const p = blockPct(ns); return `<div class="blk"><div class="row sb small"><span>${name} <span class="muted">(${ns.length > 1 ? ns[0] + '-' + ns[ns.length - 1] : ns[0]})</span></span><span class="num">${Math.round(p * 100)}%</span></div><div class="bar ${p >= 0.9 ? '' : 'violet'}"><i style="width:${p * 100}%"></i></div></div>`; }).join('')}
      <div class="blk"><div class="row sb small"><span>Сочинение <span class="muted">(27)</span></span><span class="num">${lastEssay != null ? lastEssay + ' из 22' : 'ещё не проверяли'}</span></div><div class="bar violet"><i style="width:${lastEssay != null ? lastEssay / 22 * 100 : 0}%"></i></div></div>
    </section>
    ${fipiCard()}
  </div></details>`;
}
vHome = function () {
  const P = planToday(); planSnap(P);

/* ---- после тренировки: следующий шаг плана ---- */
const vSesEnd0 = vSesEnd;
vSesEnd = function () {
  const h = vSesEnd0(), P = planToday(); planSnap(P);
  if (!P.steps.length) return h;
  const nx = P.steps.find(s => !s.done);
  return h + `<section class="card pnext">${nx ? `<div class="kicker">План дня · ${P.done} из ${P.steps.length}</div><div class="pttl">Дальше: ${esc(nx.title)}</div><div class="psub">${esc(nx.area)}${nx.min ? ` · ${nx.min} мин` : ''}</div><div class="row">${planGoBtn(nx, true)}<button class="btn sm" data-a="sesHome">К плану дня</button></div>`
    : `<div class="pdone">${ic('star', 22)}<div><b>План дня выполнен!</b><div class="small">Все шаги на сегодня сделаны - можно отдыхать.</div></div></div>`}</section>`;
};

/* ---- экран «План до ЕГЭ» ---- */
{
  const m3 = MILESTONES.find(m => m.id === 'm3'), m7 = MILESTONES.find(m => m.id === 'm7');
  if (m3) m3.t = 'Пробник русского: тест от 22 из 28 - уровень 70';
  if (m7) m7.t = 'Пробник русского: от 25 из 28 - уровень 80';
  MILESTONES.push(
    { id: 'm10', d: '2027-04-30', t: 'Сочинение ЕГЭ: от 20 из 22', auto: () => state.essays.some(e => (e.result?.total || 0) >= 20) },
    { id: 'm11', d: '2027-05-15', t: 'Пробник русского: от 27 из 28 - уровень 90+', auto: () => bestMock() >= 27, pct: () => bestMock() / 27 },
  );
  MILESTONES.sort((a, b) => a.d.localeCompare(b.d));
}
vPlan = function () {
  const t = today(), cur = planPhase(t), wd = D(t).getDay(), next = MILESTONES.find(m => !msDone(m));
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const days = ph => `<table class="tbl wrap ptbl"><tbody>${[1, 2, 3, 4, 5, 6, 0].map(i => `<tr class="${ph === cur && i === wd ? 'on' : ''}"><td>${cap(WD[i])}</td><td>${(ph.days[i] || []).map(x => PLAN_NAMES[x]).join(' · ') || 'выходной'}</td></tr>`).join('')}</tbody></table>`;
  const read = finReadWorks(), cov = finCovered().size, nx = finNextWork(), gain = nx && !finReadOf(nx.id) ? finGain(nx) : 0;
  return `<button class="back" data-a="back">${ic('left', 18)} Назад</button>
  <header class="stack" style="gap:6px"><div class="kicker">Цель - 100</div><h1 class="h1">План до ЕГЭ</h1><p class="muted" style="margin:0">Держать всё в голове не нужно. Каждый день на главной - 2-4 шага на 30-45 минут. Сделала шаг - галочка ставится сама.</p></header>
  <section class="card" style="border-left:5px solid var(--rose)"><div class="kicker">Сейчас · ${esc(cur.when)}</div><h2 class="h2">${esc(cur.name)}</h2><p style="margin:0">${esc(cur.focus)}</p>${days(cur)}<p class="muted small" style="margin:0">Ошибки - каждый день, если есть что повторить. ${cur.id === 'p1' ? '1 декабря - повторить свои книги, 2 декабря - итоговое сочинение.' : ''}</p></section>
  ${cur.id === 'p1' ? `<section class="card"><h2 class="h2">Книги для итогового</h2>
    <div class="blk"><div class="row sb small"><span>Темы, к которым у тебя есть аргументы</span><span class="num">${cov} из ${FIN_T.length}</span></div><div class="bar"><i style="width:${FIN_T.length ? cov / FIN_T.length * 100 : 0}%"></i></div></div>
    <p class="muted small" style="margin:0">${read.length ? `Прочитано: ${read.map(w => `«${esc(w.title)}»`).join(', ')}.` : 'Отмечай прочитанные книги - здесь будет видно, к каким темам хватает аргументов.'} На сочинении хватит 4-5 книг, которые знаешь хорошо.</p>

  <section class="card"><h2 class="h2">Этапы до экзамена</h2><div>${PLAN_PHASES.map(ph => { const now = ph === cur, past = t > ph.to; return `<div class="ph ${now ? 'now' : past ? 'past' : ''}"><span class="phd">${past ? ic('check', 14) : ''}</span><div style="min-width:0"><div class="row sb"><b>${esc(ph.name)}</b>${now ? '<span class="chip fire">сейчас</span>' : ''}</div><div class="muted small">${esc(ph.when)}</div>${now ? '' : `<p class="small" style="margin:4px 0 0">${esc(ph.focus)}</p>`}</div></div>`; }).join('')}</div></section>
  <section class="card"><h2 class="h2">Вехи</h2><div>${MILESTONES.map(m => { const done = msDone(m), late = !done && m.d < t, p = m.pct ? Math.max(0, Math.min(1, m.pct())) : null; return `<div class="ms"><button class="chk ${done ? 'on' : ''}" style="border:0;padding:0;width:auto" data-a="msTog" data-id="${m.id}" aria-label="Отметить"><span class="box">${ic('check', 18)}</span></button><div style="min-width:0"><div style="font-weight:800;${done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(m.t)}</div>${p != null && !done ? `<div class="bar" style="height:6px;margin-top:6px"><i style="width:${p * 100}%"></i></div>` : ''}</div><span class="when" style="${late ? 'color:var(--bad)' : ''}">до ${fmtD(m.d)}</span></div>`; }).join('')}</div></section>
  <section class="card"><h2 class="h2">Сколько нужно на 100</h2><p style="margin:0">100 баллов по русскому - это все <b>50 первичных</b>: 28 за тестовую часть и 22 за сочинение. Ступеньки (шкала 2026 года, примерно): 70 баллов - около 38 первичных, 80 - около 43, 90 - около 47.</p><p class="muted small" style="margin:0">Итоговое сочинение - это зачёт или незачёт: допуск к ЕГЭ, баллы за него не ставят.</p></section>

};

/* ---- действия ---- */
Object.assign(A, {
  planGo: b => {
    const id = b.dataset.s, start = k => { const pool = TASK_ITEMS[k] || []; if (pool.length) startPool(keyTitle(k), pool, 10, { key: k }); else toast('Здесь пока нечего решать'); };

      const w = finWork(b.dataset.w); if (!w) return;
      const d = day(); d.pk = { ...(d.pk || {}), book: w.id }; save();
      if (finReadOf(w.id)) A.finWorkQuiz({ dataset: { id: w.id } }); else A.finWork({ dataset: { id: w.id } });
    }
    else if (id === 'para') A.finParaMine();
    else if (id === 'authors') { finMinePools(); start((TASK_ITEMS['fin:nmine'] || []).length ? 'fin:nmine' : 'fin:n'); }
    else if (id === 'words') start('fin:v');
    else if (id === 'mybooks') { finMinePools(); start((TASK_ITEMS['fin:mine'] || []).length ? 'fin:mine' : 'fin:all'); }
    else if (id === 'full') { finRemember('write'); go({ v: 'final', sub: 'write', part: 'full' }); }
    else if (id === 'review') { finRemember('works'); go({ v: 'final', sub: 'works' }); }
    else if (id === 'ru') startMix();
    else if (id === 'soc' || id === 'en') A.quick({ dataset: { k: id } });

  planTick: b => {

  },
});
