<style>
/* Раскладка: одна колонка-тетрадь до 680px, листы-карточки с розовым полем слева, снизу панель из 5 вкладок.
   Гамма - пастельная сакура Даши: роза - действия, лаванда-чернила - учёба, мёд - копилка, красная ручка - ошибки. */
:root{
  color-scheme: light;
  --bg:#F7F0F3; --paper:#FFFFFF; --paper-2:#F2E6EC; --line:#E8D6DF;
  --ink:#2B1A22; --muted:#76606B; --faint:#A9939D;
  --rose:#C8507E; --rose-soft:#F7DEE8; --violet:#5B5FC7; --violet-soft:#E7E7FA;
  --good:#2A8C6C; --good-soft:#DCF1E8; --bad:#CC3550; --bad-soft:#FBE0E5; --gold:#B07A22; --gold-soft:#F8EAD0;
  --on-rose:#FFFFFF;
  --shadow:0 1px 2px rgba(90,30,55,.06),0 14px 30px -20px rgba(90,30,55,.35);
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#161015; --paper:#211820; --paper-2:#2C2029; --line:#3C2D37;
    --ink:#F5E9EF; --muted:#C4AAB6; --faint:#88717C;
    --rose:#F08FB4; --rose-soft:#46212F; --violet:#ABAEFF; --violet-soft:#2B2B4B;
    --good:#62D2AC; --good-soft:#173B31; --bad:#FF7E90; --bad-soft:#48202A; --gold:#EEC06C; --gold-soft:#3E3121;
    --on-rose:#2B0D1A;
    --shadow:0 1px 0 rgba(255,255,255,.02),0 14px 30px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#161015; --paper:#211820; --paper-2:#2C2029; --line:#3C2D37;
  --ink:#F5E9EF; --muted:#C4AAB6; --faint:#88717C;
  --rose:#F08FB4; --rose-soft:#46212F; --violet:#ABAEFF; --violet-soft:#2B2B4B;
  --good:#62D2AC; --good-soft:#173B31; --bad:#FF7E90; --bad-soft:#48202A; --gold:#EEC06C; --gold-soft:#3E3121;
  --on-rose:#2B0D1A;
  --shadow:0 1px 0 rgba(255,255,255,.02),0 14px 30px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 17px/1.5 var(--body);margin:0;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
#view{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px calc(118px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.h1{font:700 30px/1.12 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere}
.h2{font:600 20px/1.25 var(--display);margin:0;text-wrap:balance}
.kicker{font:800 13px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:15px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sb{justify-content:space-between}
.stack{display:grid;gap:12px}
.card{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:grid;gap:12px;min-width:0}
.sheet-note{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px 16px 30px;position:relative;display:grid;gap:8px}
.sheet-note::before{content:"";position:absolute;left:15px;top:16px;bottom:16px;width:2px;border-radius:2px;background:var(--rose-soft)}
.sheet-note h3{font:600 17px/1.3 var(--display);margin:0;color:var(--rose)}
.sheet-note p{margin:0;line-height:1.6}
.btn{border:0;border-radius:16px;padding:14px 18px;background:var(--paper-2);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);min-height:50px}
.btn.primary{background:var(--rose);color:var(--on-rose)}
.btn.violet{background:var(--violet);color:var(--paper)}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:8px 14px;border-radius:12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--paper);box-shadow:var(--shadow);font:700 14.5px var(--body)}
.chip.fire{background:var(--gold-soft);color:var(--gold);box-shadow:none}
.bar{height:10px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--rose)}
.bar.gold>i{background:var(--gold)}
.bar.violet>i{background:var(--violet)}
.big{font:700 52px/1 var(--display);font-variant-numeric:tabular-nums}
.big span{font-size:24px;color:var(--muted)}
.coin{font:700 44px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--paper);border:0;width:100%;text-align:left;box-shadow:var(--shadow);cursor:pointer}
.tnum{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font:700 19px var(--display);background:var(--rose-soft);color:var(--rose)}
.tnum.done{background:var(--good-soft);color:var(--good)}
.tnum.theory{background:var(--violet-soft);color:var(--violet)}
.ttl{font-weight:800;line-height:1.3}
.tmeta{font-size:14.5px;color:var(--muted)}
.pts{font:700 14px var(--display);color:var(--muted);white-space:nowrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--paper-2);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:12px;padding:10px;font-weight:800;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.back{border:0;background:none;display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--muted);cursor:pointer;padding:6px 0;justify-self:start}
.qcard{background:var(--paper);border-radius:24px;box-shadow:var(--shadow);padding:20px;display:grid;gap:16px;min-width:0;overflow-wrap:anywhere}
.qtext{font:700 21px/1.45 var(--body);margin:0;text-wrap:pretty}
.qhint{margin:0;color:var(--muted);font-size:15px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:18px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--rose)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.word{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;font:600 34px/1 var(--display);padding:10px 0}
.lt{padding:8px 1px}
.vw{min-width:40px;padding:8px 5px;border-radius:12px;border:2px dashed var(--line);background:var(--paper-2);cursor:pointer;font:inherit}
.vw:hover:not(:disabled){border-color:var(--rose)}
.vw.good{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good)}
.vw.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.vw:disabled{cursor:default}
.mk{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:9px;background:var(--violet-soft);color:var(--violet);font:700 15px var(--display);vertical-align:2px}
.digs{display:flex;gap:10px;flex-wrap:wrap}
.dig{width:58px;height:58px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font:700 21px var(--display);cursor:pointer}
.dig.on{background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.dig.good{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.dig.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.inp,.ta,select.inp{width:100%;border:2px solid var(--line);border-radius:16px;background:var(--paper);padding:14px 16px;font-size:19px;font-weight:700}
.ta{font-size:17px;font-weight:500;line-height:1.6;min-height:220px;resize:vertical}
.inp:focus,.ta:focus{outline:none;border-color:var(--violet)}
.fb{border-radius:18px;padding:16px;display:grid;gap:10px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb .head{font:700 19px var(--display)}
.fb.good .head{color:var(--good)}
.fb.bad .head{color:var(--bad)}
.fb p{margin:0}
.plus{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font:700 15px var(--display)}
.ai{background:var(--violet-soft);border-radius:16px;padding:14px;white-space:pre-line;line-height:1.6}
.ai b,.exp b,.sheet-note p b{font-weight:800;color:var(--ink)}
.aiq{font-weight:800;color:var(--violet);margin-bottom:4px}
.fb .right{font-size:18px}
.fb .ans{font:700 21px var(--display);color:var(--ink);background:var(--paper);border-radius:10px;padding:2px 10px;display:inline-block;max-width:100%}
.fb .exp{line-height:1.65}
.chk{display:flex;gap:12px;align-items:center;padding:10px 2px;border:0;background:none;width:100%;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.box{flex:none;width:32px;height:32px;border-radius:10px;border:2.5px solid var(--rose);display:grid;place-items:center;color:transparent}
.chk.on .box{background:var(--rose);color:var(--on-rose)}
.chk.on .ctext{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rose)}
.chk.auto .box{border-style:dashed}
.ctext{flex:1;min-width:0;font-weight:700}
.cplus{font:700 13px var(--display);color:var(--gold);white-space:nowrap}
.err{border-radius:18px;background:var(--paper);box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:6px;border-left:5px solid var(--bad)}
.err.ok{border-left-color:var(--good)}
.err .q{font-weight:800;line-height:1.35}
.dots{display:inline-flex;gap:5px;vertical-align:middle}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--paper-2);border:2px solid var(--line)}
.dots i.on{background:var(--good);border-color:var(--good)}
.gift{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.gift:last-child{border-bottom:0}
.tbl{width:100%;border-collapse:collapse;font-size:15.5px}
.tbl td{padding:8px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-weight:800;color:var(--gold);white-space:nowrap}
.tbl.wrap td{vertical-align:top}
.tbl.wrap td:first-child{width:38%;font-weight:800;padding-right:10px}
.tbl.wrap td:last-child{white-space:normal;text-align:left;color:var(--ink);font-weight:600}
.blk{display:grid;gap:6px}
.blk .row{font-weight:700}
a.lnk{color:var(--violet);font-weight:800;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--paper) 93%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font:800 11.5px var(--body);color:var(--muted);cursor:pointer;position:relative;min-width:0}
.tab.on{color:var(--rose)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font:800 12px/20px var(--body)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:800;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
#sheetWrap{position:fixed;inset:0;z-index:50;background:rgba(30,10,20,.45);display:grid;align-items:end;justify-items:center;padding:16px}
#sheet{background:var(--bg);border-radius:26px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:grid;gap:14px;margin-bottom:env(safe-area-inset-bottom,0px)}
.celebrate{text-align:center;display:grid;gap:10px;justify-items:center}
.celebrate .coin{font-size:56px}
.lbl{display:grid;gap:6px;font-weight:800;font-size:15px;color:var(--muted)}
.wc{font:700 15px var(--display)}
.wc.low{color:var(--bad)}
.krow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.txt{background:var(--paper-2);border-radius:18px;padding:12px 14px}
.txt summary{cursor:pointer;font-weight:800;color:var(--violet)}
.txtbody{display:grid;gap:6px;margin-top:10px;max-height:46vh;overflow:auto;line-height:1.55}
.txtbody p{margin:0}
.sn{color:var(--rose);font-family:var(--display);font-size:14px}
.ropt{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;padding:14px 14px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:17px;cursor:pointer;line-height:1.45}
.ropt .rn{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--paper-2);font:700 15px var(--display)}
.ropt.on{border-color:var(--violet);background:var(--violet-soft)}
.ropt.on .rn{background:var(--violet);color:var(--paper)}
.ropt.good{border-color:var(--good);background:var(--good-soft)}
.ropt.bad{border-color:var(--bad);background:var(--bad-soft)}
.mright{display:grid;gap:6px;background:var(--paper-2);border-radius:16px;padding:12px 14px;line-height:1.45;font-size:16px}
.mrow{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .ml{font-weight:800;line-height:1.4}
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.mchip{min-width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font:700 16px var(--display);cursor:pointer}
.mchip.on{background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.mchip.good{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.mchip.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.hardtag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--bad-soft);color:var(--bad);font:800 12px var(--body);vertical-align:2px}
.hardtag.exctag{background:var(--gold-soft);color:var(--gold)}
.excbox{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:14px;padding:10px 12px;line-height:1.55}
.excbox>b:first-child{color:var(--gold);font-weight:800}
.excbox.soft{background:var(--paper);border-left-color:var(--violet)}
.excbox.soft>b:first-child{color:var(--violet)}
.excd{background:var(--paper);border-radius:14px;padding:10px 12px;line-height:1.55}
.excd summary{cursor:pointer;font-weight:800;color:var(--gold)}
.excd b,.excline b,.excbox b{font-weight:800;color:var(--ink)}
.excline{padding:8px 0 8px 12px;border-left:3px solid var(--gold-soft);line-height:1.5}
.ms{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:0}
.ms .when{font:700 13px var(--display);color:var(--muted);white-space:nowrap}
.krow b.k{font:700 15px var(--display);color:var(--violet)}
/* версия 11: разбор и теория по кнопке, «Подтянуть», избранное */
.btn.gold{background:var(--gold-soft);color:var(--gold)}
.fbd{background:var(--paper);border-radius:14px;padding:10px 14px;line-height:1.55}
.fbd>summary{cursor:pointer;font-weight:800;color:var(--violet);padding:6px 0;font-size:17px}
.fbd>.stack{margin-top:8px}
.fbd .sheet-note{box-shadow:none;border:1.5px solid var(--line)}
.parts{display:grid;gap:8px}

      { h: 'Пять правил, которые закрывают половину списка', p: '**1. Прошедшее время, женский род** - ударение на окончание: бралА, ждалА, началА, понялА. Но: клАла, крАлась, послАла.\n**2. Глаголы на -ить** - обычно ударение на окончании: звонИт, вручИт, включИт, облегчИт. Но есть исключения с ударением на корне: клЕить, освЕдомиться, озлОбить, опОшлить, закУпорить.\n**3. Причастия на -ённый** - ударение на Ё: заселЁнный, отключЁнный.\n**4. Краткие формы женского рода** - на конце: занятА, принятА, заселенА, вернА, ловкА. Но: прозорлИва.\n**5. Мн. число существительных** - часто ударение как в единственном: тОрт - тОрты, шАрф - шАрфы, бАнт - бАнты.' },
      { h: 'Как запомнить', p: 'Звонят колокола - телефон звонИт.\nСвЁкла - как «свЁкор» и «Ёлка»: ударная Ё.\nКвартАл - запомни фразой «в нашем квартАле».\nДокумЕнт, цемЕнт, экспЕрт, портфЕль - ударение на Е в конце.\nКаталОг, некролОг, диалОг - как «лОг» в конце.' },
      { h: 'Как решать в экзамене', p: 'Читай каждое слово вслух с выделенной буквой. Ищи то, где ударение «режет слух» или где ты знаешь правило. Сомневаешься - вспомни, было ли слово в тренировке.' },
    ] },
  { n: 5, title: 'Паронимы', pts: 1, block: 'norm', fipi: 'Найти неверно употреблённое слово и заменить его паронимом.',

      { h: 'Что это', p: 'Паронимы - похожие слова с одним корнем, но разным смыслом: эффектный (красивый) и эффективный (действенный). Ошибка - когда одно поставили вместо другого.' },
      { h: 'Самые частые пары', p: '**адресат** - кому пишут / **адресант** - кто пишет\n**абонент** - кто пользуется связью / **абонемент** - право пользоваться (в бассейн)\n**гарантийный** ремонт, срок / **гарантированный** доход, успех\n**двоякое** впечатление / **двойная** порция / **двойственное** положение\n**действенный** способ (работает) / **действительный** факт (настоящий), паспорт действителен\n**дипломант** - награждён на конкурсе / **дипломат** - служит / **дипломник** - пишет диплом\n**жилая** площадь, дом / **жилищные** условия / **жизненный** опыт / **житейская** мудрость\n**зрительный** зал, образ / **зрительские** симпатии\n**комфортабельный** автобус, номер / **комфортные** условия\n**лесистая** местность / **лесная** тропа\n**надеть** на себя / **одеть** кого-то\n**нестерпимая** боль / **нетерпимый** к недостаткам\n**отрывок** из книги / **обрывок** бумаги\n**представить** - познакомить, показать / **предоставить** - дать\n**практичная** одежда / **практические** занятия\n**сытный** обед / **сытый** человек\n**удачный** день / **удачливый** человек\n**экономичный** двигатель / **экономный** человек / **экономический** кризис\n**эффектное** платье / **эффективный** метод\n**гуманный** поступок / **гуманитарная** помощь\n**информативный** доклад / **информационный** выпуск' },
      { h: 'Как решать', p: 'Для каждого выделенного слова спроси: «что оно значит здесь?». Подставь пароним - если смысл стал правильнее, ошибка найдена.' },

      { id: 'r5-02', type: 'choice', q: 'В салоне … автобуса было тепло и тихо.', o: ['комфортного', 'комфортабельного'], a: 1, ex: 'Комфортабельный - об удобно устроенном транспорте и помещении. Комфортные - условия, ощущения.' },

      { id: 'r5-10', type: 'choice', q: 'Пострадавшие регионы получили … помощь.', o: ['гуманную', 'гуманитарную'], a: 1, ex: 'Гуманитарная помощь - продукты, лекарства для людей в беде. Гуманный - человечный (гуманный поступок).' },

      { id: 'r5-15', type: 'choice', q: 'Бабушка приготовила … обед.', o: ['сытый', 'сытный'], a: 1, ex: 'Сытный обед - насыщающий. Сытый - тот, кто наелся.' },

  { n: 8, title: 'Грамматические ошибки', pts: 2, block: 'norm', fipi: 'Соотнести 5 видов ошибок с предложениями (из 9). 2 балла: все верно - 2, одна-две ошибки - 1.',

      { h: 'Приметы ошибок', p: '**Предлог + падеж.** Благодаря, согласно, вопреки, наперекор + ЧЕМУ (дательный): согласно расписанию. По приезде, по окончании, по завершении - на -е.\n**Подлежащее и сказуемое.** «Те, кто пришёл» - кто всегда в единственном числе: все, кто пришёл.\n**Приложение-название.** После родового слова название не склоняется: в повести «Капитанская дочка». Без родового - склоняется: в «Капитанской дочке».\n**Однородные члены.** Одно слово-управитель на два разных вопроса: «люблю и восхищаюсь музыкой» (люблю ЧТО, восхищаюсь ЧЕМ). И неправильные пары союзов: не только... но и; как... так и.\n**Причастный оборот.** Причастие не согласовано («картинами, висящих») или определяемое слово попало внутрь оборота («сдавшие ученики экзамен»).\n**Деепричастный оборот.** Действие деепричастия должен делать тот же, кто делает главное действие: «Читая книгу, у меня возник вопрос» - книгу читал не вопрос.\n**Косвенная речь.** «Он сказал, что я приду» - перепутаны «я» и «он». Нужно: он сказал, что придёт.\n**Сложное предложение.** Лишний союз: «Я не знала о том, что как сильно ты скучаешь» - «что» лишнее.' },
      { h: 'Как решать', p: 'Сначала найди лёгкие приметы: деепричастие (-я, -в, -вши), «согласно/благодаря/по приезде», кавычки с родовым словом, «кто пришли». Потом остальное.' },

  { n: 9, title: 'Корни', pts: 1, block: 'orth', fipi: 'Найти ряды, где во всех словах пропущена одна и та же буква.',
    theory: [
      { h: 'Три вида корней', p: '**Проверяемые** - подбери слово, где гласная под ударением: в..да - вОды, значит «вода».\nЛовушка: не проверяй глаголом на -ывать/-ивать: опоздать НЕ проверяется «опаздывать».\n**Непроверяемые** - словарные, просто запомни: апельсин, привилегия, интеллигенция, компания (друзья) и кампания (поход, мероприятие).\n**Чередующиеся** - пишутся по правилу, проверять ударением НЕЛЬЗЯ.' },
      { h: 'Чередования - по примете', p: '**лаг/лож:** перед Г - А (предлагать), перед Ж - О (предложить).\n**раст/рос:** перед СТ и Щ - А (растение, выращенный), перед С - О (вырос). Исключения: росток, ростовщик, отрасль.\n**гар/гор, клан/клон, твар/твор:** без ударения - О (загорать, поклониться, творить). Исключения: выгарки, утварь.\n**зар/зор:** без ударения - А (заря, озарённый).\n**плав/плов:** почти всегда А (плавать), но: пловец, пловчиха.\n**скак/скоч:** перед К - А (скакать), перед Ч - О (выскочка). Исключения: скачок, скачу.\n**кас/кос:** есть суффикс -А- после корня - пиши А (касаться), нет - О (коснуться).\n**бер/бир, мер/мир, тер/тир, стел/стил, блест/блист, жег/жиг:** есть суффикс -А- после корня - И (собирать, расстилать), нет - Е (соберу, расстелить).\n**равн/ровн:** равный (одинаковый) - А (уравнение), ровный (гладкий) - О (выровнять). Исключения: равнина, ровесник.' },
      { h: 'Как решать', p: 'Для каждого ряда сначала реши, какой это корень: проверяемый, словарный или с чередованием. Чередование - сразу правило, ударение не помогает.' },

  { id: 'r5-40', type: 'choice', q: 'Студент … анкету и сдал её в деканат.', o: ['заполнил', 'наполнил'], a: 0, ex: 'Заполнить - вписать нужные сведения (заполнить анкету) или занять собой всё место (зрители заполнили зал). Наполнить - налить, насыпать доверху (наполнить стакан).' },
  { id: 'r5-41', type: 'choice', q: 'Летом Даша решила … пробелы в знаниях по химии.', o: ['пополнить', 'восполнить'], a: 1, ex: 'Восполнить - возместить то, чего не хватает (восполнить пробел, потерю). Пополнить - увеличить, добавив новое (пополнить библиотеку, запасы).' },
  { id: 'r5-42', type: 'choice', q: 'Зрители … зал, и многим пришлось стоять в проходах.', o: ['переполнили', 'дополнили'], a: 0, ex: 'Переполнить - заполнить сверх меры (переполнить зал, сердце переполнено радостью). Дополнить - добавить недостающее (дополнить ответ, список).' },
  { id: 'r5-43', type: 'choice', q: 'Разведчики незаметно пробрались во … тыл.', o: ['враждебный', 'вражеский'], a: 1, ex: 'Вражеский - принадлежащий врагу (вражеский тыл, вражеские самолёты). Враждебный - полный вражды, неприязни (враждебный взгляд, враждебное отношение).' },
  { id: 'r5-44', type: 'choice', q: 'В магазине Аня долго … подарок для мамы.', o: ['выбирала', 'избирала'], a: 0, ex: 'Выбирать - отбирать подходящее из нескольких (выбирать подарок). Избирать - официально выбирать голосованием (избирать депутатов) или книжное «выбирать» в высоком стиле (избрать свой путь).' },
  { id: 'r5-45', type: 'choice', q: 'Ради собственной … он готов был обмануть друга.', o: ['выгодности', 'выгоды'], a: 1, ex: 'Выгода - польза, прибыль (собственная выгода, извлечь выгоду). Выгодность - свойство того, что выгодно (выгодность сделки, предложения).' },
  { id: 'r5-46', type: 'choice', q: 'Спортсмен тренировался с полной …', o: ['отдачей', 'выдачей'], a: 0, ex: 'Отдача - результат, польза от труда и усилий (работать с полной отдачей). Выдача - действие по глаголу «выдать» (выдача паспортов, зарплаты).' },
  { id: 'r5-47', type: 'choice', q: 'Вечером по телевизору показывали … о дикой природе.', o: ['раздачу', 'передачу'], a: 1, ex: 'Передача - радио- или телепрограмма, а также действие «передать» (передача знаний). Раздача - действие «раздать» многим (раздача листовок, подарков).' },
  { id: 'r5-48', type: 'choice', q: '… проезда в этом автобусе - только картой.', o: ['Оплата', 'Выплата'], a: 0, ex: 'Оплата - расчёт за товар или услугу (оплата проезда). Выплата - выдача денег тому, кому они положены (выплата зарплаты, пособий).' },
  { id: 'r5-49', type: 'choice', q: 'Квартирная … в этом году выросла.', o: ['уплата', 'плата'], a: 1, ex: 'Плата - деньги, которые платят за что-то (квартирная плата, плата за обучение). Уплата - внесение суммы, действие «уплатить» (уплата налогов, долга).' },
  { id: 'r5-50', type: 'choice', q: 'Нужно … счёт за электричество до конца месяца.', o: ['оплатить', 'отплатить'], a: 0, ex: 'Оплатить - внести плату за что-то (оплатить счёт, проезд) - без предлога «за». Отплатить - ответить тем же: отблагодарить или отомстить (отплатить добром за добро).' },
  { id: 'r5-51', type: 'choice', q: 'Государство … пенсионерам единовременное пособие.', o: ['уплатило', 'выплатило'], a: 1, ex: 'Выплатить - выдать положенные деньги (выплатить пособие, зарплату) или вернуть долг полностью. Уплатить - внести обязательный платёж (уплатить налог, штраф).' },
  { id: 'r5-52', type: 'choice', q: 'За билет в кино Аня … триста рублей.', o: ['заплатила', 'отплатила'], a: 0, ex: 'Заплатить - отдать деньги за что-то (заплатить за билет, заплатить триста рублей). Отплатить - ответить на чей-то поступок тем же (отплатить за доброту).' },
  { id: 'r5-53', type: 'choice', q: 'Бабушка … на даче огромные тыквы.', o: ['отрастила', 'вырастила'], a: 1, ex: 'Вырастить - ухаживать, пока растёт растение, животное, ребёнок (вырастить тыкву, сына). Отрастить - дать отрасти своим волосам, ногтям (отрастить косу).' },
  { id: 'r5-54', type: 'choice', q: 'Мастер в салоне предложила … ногти гелем.', o: ['нарастить', 'отрастить'], a: 0, ex: 'Нарастить - увеличить, добавив сверху (нарастить ногти, ресницы, мощность). Отрастить - дать вырасти естественно (отрастить волосы).' },
  { id: 'r5-55', type: 'choice', q: 'Фермер занимается … клубники.', o: ['наращиванием', 'выращиванием'], a: 1, ex: 'Выращивание - уход за растениями, животными, пока они растут (выращивание клубники). Наращивание - увеличение, добавление (наращивание производства, ресниц).' },
  { id: 'r5-56', type: 'choice', q: 'Отец решил заняться … бороды.', o: ['отращиванием', 'выращиванием'], a: 0, ex: 'Отращивание - когда дают отрасти своим волосам, бороде, ногтям. Выращивание - уход за растениями и животными (выращивание овощей).' },
  { id: 'r5-57', type: 'choice', q: 'У певицы очень … голос.', o: ['высотный', 'высокий'], a: 1, ex: 'Высокий - большой по высоте или тонкий по звучанию, а также значительный (высокий голос, высокая оценка). Высотный - связанный с большой высотой (высотное здание, высотный полёт).' },
  { id: 'r5-58', type: 'choice', q: 'На уроке физики мы изучали … колебания.', o: ['гармонические', 'гармоничные'], a: 0, ex: 'Гармонический - термин музыки, физики, математики (гармонические колебания, гармонический ряд). Гармоничный - согласованный, стройный (гармоничная пара, гармоничное развитие).' },
  { id: 'r5-59', type: 'choice', q: 'На полке стоял … кувшин.', o: ['глинистый', 'глиняный'], a: 1, ex: 'Глиняный - сделанный из глины (глиняный кувшин). Глинистый - содержащий много глины (глинистая почва).' },
  { id: 'r5-60', type: 'choice', q: 'Мама купила одежду для … малыша.', o: ['годовалого', 'годового'], a: 0, ex: 'Годовалый - в возрасте одного года (годовалый малыш). Годовой - рассчитанный на год, итоговый за год (годовой отчёт, годовой доход).' },
  { id: 'r5-61', type: 'choice', q: 'Бухгалтер готовит … отчёт компании.', o: ['годичный', 'годовой'], a: 1, ex: 'Годовой - за год, итог года (годовой отчёт, годовая оценка). Годичный - длящийся один год (годичные курсы, годичный срок).' },
  { id: 'r5-62', type: 'choice', q: 'Родители смотрели на дочь-медалистку с …', o: ['гордостью', 'гордыней'], a: 0, ex: 'Гордость - чувство удовлетворения, самоуважения (смотреть с гордостью). Гордыня - чрезмерная гордость, высокомерие (грех гордыни).' },
  { id: 'r5-63', type: 'choice', q: '… - направление в культуре эпохи Возрождения, ставившее человека в центр мира.', o: ['Гуманность', 'Гуманизм'], a: 1, ex: 'Гуманизм - система взглядов, признающая ценность человека (гуманизм эпохи Возрождения). Гуманность - человечность, доброе отношение к людям (проявить гуманность).' },
  { id: 'r5-64', type: 'choice', q: 'Писатель отстаивал … идеалы: свободу и достоинство личности.', o: ['гуманистические', 'гуманитарные'], a: 0, ex: 'Гуманистический - связанный с гуманизмом как мировоззрением (гуманистические идеалы, традиции). Гуманитарный - относящийся к наукам о человеке и обществе или к помощи людям (гуманитарный класс, гуманитарная помощь).' },
  { id: 'r5-65', type: 'choice', q: 'Компьютер хранит информацию в … коде из нулей и единиц.', o: ['двойном', 'двоичном'], a: 1, ex: 'Двоичный - основанный на двух знаках, 0 и 1 (двоичный код, двоичная система). Двойной - состоящий из двух частей или вдвое больший (двойная порция, двойное дно).' },
  { id: 'r5-66', type: 'choice', q: 'У героини было … чувство: она и радовалась, и боялась.', o: ['двойственное', 'удвоенное'], a: 0, ex: 'Двойственный - раздвоенный, противоречивый (двойственное чувство, положение). Удвоенный - увеличенный вдвое (удвоенная порция, с удвоенной силой).' },
  { id: 'r5-67', type: 'choice', q: 'После обеда у нас … урок физкультуры - целых полтора часа.', o: ['двоичный', 'сдвоенный'], a: 1, ex: 'Сдвоенный - соединённый из двух (сдвоенный урок, сдвоенные колёса). Двоичный - основанный на двух знаках, 0 и 1 (двоичный код).' },
  { id: 'r5-68', type: 'choice', q: 'Туристы поднялись к кратеру … вулкана.', o: ['действующего', 'действенного'], a: 0, ex: 'Действующий - работающий, активный сейчас (действующий вулкан, действующий закон). Действенный - дающий результат, эффективный (действенный способ).' },
  { id: 'r5-69', type: 'choice', q: 'На встречу с партнёрами отец надел строгий … костюм.', o: ['деловитый', 'деловой'], a: 1, ex: 'Деловой - связанный с работой, службой (деловой костюм, деловая встреча). Деловитый - энергичный и толковый в делах (деловитый хозяин, деловитый вид).' },
  { id: 'r5-70', type: 'choice', q: 'Учитель похвалил ученика за … предложение.', o: ['дельное', 'деляческое'], a: 0, ex: 'Дельный - разумный, толковый (дельное предложение, дельный совет). Деляческий - свойственный дельцу, который думает только о выгоде (деляческий подход).' },
  { id: 'r5-71', type: 'choice', q: 'В стране прошли свободные … выборы.', o: ['демократичные', 'демократические'], a: 1, ex: 'Демократический - относящийся к демократии как политическому строю (демократические выборы, демократическое государство). Демократичный - простой в общении, доступный (демократичный руководитель, демократичная обстановка).' },
  { id: 'r5-72', type: 'choice', q: 'Посол передал ноту по … каналам.', o: ['дипломатическим', 'дипломатичным'], a: 0, ex: 'Дипломатический - относящийся к дипломатии, к отношениям между государствами (дипломатические каналы, дипломатический паспорт). Дипломатичный - тактичный, умеющий обходить острые углы (дипломатичный ответ).' },
  { id: 'r5-73', type: 'choice', q: 'После … болезни бабушка наконец вернулась домой.', o: ['длинной', 'длительной'], a: 1, ex: 'Длительный - продолжающийся долгое время (длительная болезнь, длительная командировка). Длинный - большой в длину (длинная коса, длинный коридор).' },
  { id: 'r5-74', type: 'choice', q: 'Мама купила … зимние сапоги, которые прослужат много лет.', o: ['добротные', 'добрые'], a: 0, ex: 'Добротный - прочный, хорошо сделанный (добротные сапоги, добротный дом). Добрый - отзывчивый, несущий добро (добрый человек, добрые слова).' },
  { id: 'r5-75', type: 'choice', q: 'Котёнок оказался …: сразу пошёл к нам на руки.', o: ['доверительным', 'доверчивым'], a: 1, ex: 'Доверчивый - легко верящий другим (доверчивый котёнок, ребёнок). Доверительный - основанный на доверии, откровенный (доверительный разговор, тон).' },
  { id: 'r5-76', type: 'choice', q: 'Эта осень выдалась …', o: ['дождливой', 'дождевой'], a: 0, ex: 'Дождливый - с частыми дождями (дождливая осень, погода). Дождевой - относящийся к дождю, от дождя (дождевая вода, дождевой червь, плащ).' },
  { id: 'r5-77', type: 'choice', q: 'Она с детства мечтала играть в … театре.', o: ['драматичном', 'драматическом'], a: 1, ex: 'Драматический - относящийся к драме, театру (драматический театр, актёр). Драматичный - напряжённый, полный волнений (драматичная ситуация, развязка).' },
  { id: 'r5-78', type: 'choice', q: 'Президенты двух … стран подписали договор о сотрудничестве.', o: ['дружественных', 'дружеских'], a: 0, ex: 'Дружественный - основанный на дружбе, обычно о странах и народах (дружественные государства). Дружеский - свойственный друзьям, между друзьями (дружеский совет, дружеское письмо).' },
  { id: 'r5-79', type: 'choice', q: 'Наш класс очень …: мы всегда помогаем друг другу.', o: ['дружеский', 'дружный'], a: 1, ex: 'Дружный - живущий в согласии, сплочённый (дружный класс, дружная семья). Дружеский - как между друзьями (дружеская встреча, дружеский шарж).' },
  { id: 'r5-80', type: 'choice', q: 'Это был … случай: больше такого не повторялось.', o: ['единичный', 'единый'], a: 0, ex: 'Единичный - отдельный, редкий (единичный случай). Единый - общий, объединённый, цельный (единый государственный экзамен, единый проездной).' },
  { id: 'r5-81', type: 'choice', q: 'Теннисистка выиграла турнир в … разряде.', o: ['единственном', 'одиночном'], a: 1, ex: 'Одиночный - состоящий из одного, совершаемый в одиночку (одиночный разряд, одиночное плавание). Единственный - только один, без других (единственный сын, единственный выход).' },
  { id: 'r5-82', type: 'choice', q: 'Сын - всегда … гость в доме родителей.', o: ['желанный', 'желательный'], a: 0, ex: 'Желанный - тот, кого или что очень ждут (желанный гость, желанная встреча). Желательный - такой, который был бы хорош, полезен (желательный срок, желательное условие).' },
  { id: 'r5-83', type: 'choice', q: 'Мясо оказалось … и плохо жевалось.', o: ['жестоким', 'жёстким'], a: 1, ex: 'Жёсткий - твёрдый, упругий или строгий (жёсткое мясо, жёсткая вода, жёсткие условия). Жестокий - безжалостный, причиняющий страдания (жестокий поступок).' },
  { id: 'r5-84', type: 'choice', q: 'У каждого растения есть свой … цикл.', o: ['жизненный', 'житейский'], a: 0, ex: 'Жизненный - относящийся к жизни, существованию (жизненный цикл, жизненно важный). Житейский - бытовой, повседневный (житейские мелочи, житейская мудрость).' },
  { id: 'r5-85', type: 'choice', q: 'Упавшее дерево … дорогу, и машины встали.', o: ['оградило', 'перегородило'], a: 1, ex: 'Перегородить - поставить преграду поперёк (перегородить дорогу, реку). Оградить - защитить от чего-то (оградить от опасности).' },
  { id: 'r5-86', type: 'choice', q: 'Мама старалась … сына от плохой компании.', o: ['оградить', 'огородить'], a: 0, ex: 'Оградить - защитить, уберечь (оградить от неприятностей). Огородить - обнести забором (огородить участок).' },
  { id: 'r5-87', type: 'choice', q: 'Грузовик … въезд во двор, и мы не могли выехать.', o: ['отгородил', 'загородил'], a: 1, ex: 'Загородить - закрыть, преградить путь или вид (загородить проход, свет). Отгородить - отделить перегородкой (отгородить угол комнаты).' },
  { id: 'r5-88', type: 'choice', q: 'Чтобы заплатить меньше налогов, фирма … в отчёте свои доходы.', o: ['занизила', 'снизила'], a: 0, ex: 'Занизить - указать или поставить меньше, чем есть на самом деле (занизить доходы, оценку). Снизить - сделать меньше по-настоящему (снизить цены, скорость).' },
  { id: 'r5-89', type: 'choice', q: 'Командир … солдата в звании за нарушение дисциплины.', o: ['снизил', 'понизил'], a: 1, ex: 'Понизить - перевести на более низкую ступень (понизить в звании, в должности) или сделать ниже (понизить голос). Снизить - уменьшить (снизить цены, расходы).' },
  { id: 'r5-90', type: 'choice', q: 'Учитель выяснил, кто был … драки.', o: ['зачинщиком', 'зачинателем'], a: 0, ex: 'Зачинщик - тот, кто начал что-то плохое (зачинщик драки, ссоры). Зачинатель - тот, кто первым начал важное дело (зачинатель русской литературы).' },
  { id: 'r5-91', type: 'choice', q: 'На снегу виднелись … следы.', o: ['зверские', 'звериные'], a: 1, ex: 'Звериный - принадлежащий зверю, свойственный зверю (звериные следы, звериная нора). Зверский - жестокий, свирепый, в разговорной речи - очень сильный (зверское преступление, зверский аппетит).' },
  { id: 'r5-92', type: 'choice', q: 'У чтеца был красивый … голос.', o: ['звучный', 'звуковой'], a: 0, ex: 'Звучный - громкий и красивый по звучанию (звучный голос). Звуковой - относящийся к звуку (звуковой сигнал, звуковая дорожка).' },
  { id: 'r5-93', type: 'choice', q: 'После бессонной ночи у него был … цвет лица.', o: ['земной', 'землистый'], a: 1, ex: 'Землистый - серый, нездоровый, цвета земли (землистый цвет лица) или с примесью земли. Земной - относящийся к Земле, к жизни на ней (земной шар, земные радости).' },
  { id: 'r5-94', type: 'choice', q: 'Рабочие начали … работы: рыть котлован.', o: ['земляные', 'земные'], a: 0, ex: 'Земляной - из земли или связанный с работой с землёй (земляные работы, земляной вал). Земной - относящийся к планете Земля (земная орбита, земное притяжение).' },
  { id: 'r5-95', type: 'choice', q: 'Находчивый и … Петя всегда придумывал, как выкрутиться.', o: ['изобретательский', 'изобретательный'], a: 1, ex: 'Изобретательный - находчивый, умеющий придумывать (изобретательный ум, ребёнок). Изобретательский - относящийся к изобретениям и изобретателям (изобретательская деятельность).' },
  { id: 'r5-96', type: 'choice', q: 'Опрос показал высокую … жителей о новых правилах.', o: ['информированность', 'информационность'], a: 0, ex: 'Информированность - осведомлённость человека о чём-то (информированность жителей). Информационность - насыщенность информацией (информационность текста, доклада).' },
  { id: 'r5-97', type: 'choice', q: 'Учёный собрал … о редких птицах края.', o: ['информированность', 'информацию'], a: 1, ex: 'Информация - сведения о чём-то (собрать информацию). Информированность - осведомлённость человека (высокая информированность).' },
  { id: 'r5-98', type: 'choice', q: 'Мой дядя - человек …: ни одна глупость не обходится без его шутки.', o: ['ироничный', 'иронический'], a: 0, ex: 'Ироничный - склонный к иронии, насмешливый (ироничный человек). Иронический - содержащий иронию, о произведениях и жанрах (иронический детектив, иронический тон).' },
  { id: 'r5-99', type: 'choice', q: 'Для праздника купили … ёлку, чтобы не рубить живую.', o: ['искусную', 'искусственную'], a: 1, ex: 'Искусственный - сделанный человеком, ненастоящий (искусственная ёлка, искусственный мех). Искусный - умелый, мастерский (искусный мастер, искусная вышивка).' },
  { id: 'r5-100', type: 'choice', q: 'Пианистку похвалили за высокое … мастерство.', o: ['исполнительское', 'исполнительное'], a: 0, ex: 'Исполнительский - относящийся к исполнению музыки, роли (исполнительское мастерство). Исполнительный - старательно выполняющий поручения (исполнительный сотрудник) или связанный с исполнением решений (исполнительная власть).' },
  { id: 'r5-101', type: 'choice', q: 'Секретарь присвоила письму … номер и отправила его.', o: ['исходный', 'исходящий'], a: 1, ex: 'Исходящий - отправляемый из учреждения (исходящий номер, исходящий звонок). Исходный - начальный, отправной (исходная точка, исходные данные).' },
  { id: 'r5-102', type: 'choice', q: 'В центре площади стоит … памятник.', o: ['каменный', 'каменистый'], a: 0, ex: 'Каменный - сделанный из камня (каменный памятник, дом). Каменистый - покрытый камнями (каменистая дорога, почва).' },
  { id: 'r5-103', type: 'choice', q: 'Над дверью висела старая … подкова.', o: ['конная', 'конская'], a: 1, ex: 'Конский - относящийся к лошади, принадлежащий ей (конская подкова, грива). Конный - на лошадях, с участием лошадей (конная прогулка, конный спорт).' },
  { id: 'r5-104', type: 'choice', q: 'Его семья - … москвичи: здесь жили ещё прадеды.', o: ['коренные', 'корневые'], a: 0, ex: 'Коренной - исконный, местный по происхождению или главный (коренной житель, коренные изменения). Корневой - относящийся к корню (корневая система, корневая гласная).' },
  { id: 'r5-105', type: 'choice', q: 'Борец был невысоким, но …', o: ['коренным', 'коренастым'], a: 1, ex: 'Коренастый - невысокий, плотный и крепкий (коренастый борец). Коренной - исконный или главный (коренной житель, коренной зуб).' },
  { id: 'r5-106', type: 'choice', q: 'Мастер вырезал из моржового клыка … гребень.', o: ['костяной', 'костный'], a: 0, ex: 'Костяной - сделанный из кости (костяной гребень). Костный - относящийся к костям организма (костный мозг, костная ткань).' },
  { id: 'r5-107', type: 'choice', q: 'Дети нарисовали … плакат к празднику.', o: ['красящий', 'красочный'], a: 1, ex: 'Красочный - яркий, многоцветный, выразительный (красочный плакат, красочное описание). Красящий - тот, который красит (красящее вещество).' },
  { id: 'r5-108', type: 'choice', q: 'Вдоль улицы тянулись … заборы зелёного цвета.', o: ['крашеные', 'красящие'], a: 0, ex: 'Крашеный - покрытый краской (крашеный забор, крашеные волосы). Красящий - способный окрашивать (красящее средство).' },
  { id: 'r5-109', type: 'choice', q: 'Для выпускного Аня купила … туфли.', o: ['лакировочные', 'лакированные'], a: 1, ex: 'Лакированный - покрытый лаком, блестящий (лакированные туфли). Лакировочный - служащий для покрытия лаком (лакировочный цех, станок).' },
  { id: 'r5-110', type: 'choice', q: 'На … шкатулке была нарисована тройка лошадей.', o: ['лаковой', 'лакировочной'], a: 0, ex: 'Лаковый - покрытый лаком, расписанный по лаку (лаковая шкатулка, лаковая миниатюра). Лакировочный - служащий для лакировки (лакировочный станок).' },
  { id: 'r5-111', type: 'choice', q: 'Из-за … ветра хотелось скорее вернуться домой.', o: ['ледового', 'ледяного'], a: 1, ex: 'Ледяной - очень холодный или сделанный изо льда (ледяной ветер, ледяная горка). Ледовый - связанный со льдом как поверхностью, обстановкой (ледовая арена, Ледовое побоище).' },
  { id: 'r5-112', type: 'choice', q: 'Это моё … дело, и я не хочу его обсуждать.', o: ['личное', 'личностное'], a: 0, ex: 'Личный - принадлежащий конкретному человеку, касающийся его самого (личное дело, личные вещи). Личностный - относящийся к личности, к качествам человека (личностный рост, личностные качества).' },
  { id: 'r5-113', type: 'choice', q: 'В лаборатории провели … исследование крови.', o: ['микроскопичное', 'микроскопическое'], a: 1, ex: 'Микроскопический - выполняемый с помощью микроскопа или видимый только в микроскоп (микроскопическое исследование). Микроскопичный - крошечный, очень маленький, в переносном смысле (микроскопичная порция).' },
  { id: 'r5-114', type: 'choice', q: 'Мама положила мясо в … камеру.', o: ['морозильную', 'морозную'], a: 0, ex: 'Морозильный - служащий для замораживания (морозильная камера). Морозный - с морозом, холодный (морозный день, морозное утро).' },
  { id: 'r5-115', type: 'choice', q: 'На ужин мы купили … рыбу и разморозили её.', o: ['морозильную', 'мороженую'], a: 1, ex: 'Мороженый - подвергшийся замораживанию (мороженая рыба, мороженые овощи). Морозильный - предназначенный для замораживания (морозильная камера).' },
  { id: 'r5-116', type: 'choice', q: '… ребёнок сразу заметил, что учительница сменила причёску.', o: ['Наблюдательный', 'Наблюдательский'], a: 0, ex: 'Наблюдательный - умеющий замечать (наблюдательный ребёнок) или служащий для наблюдения (наблюдательный пункт). Наблюдательский - относящийся к наблюдателю (наблюдательская миссия).' },
  { id: 'r5-117', type: 'choice', q: 'В кассе осталась небольшая …: всего пятьсот рублей.', o: ['наличие', 'наличность'], a: 1, ex: 'Наличность - наличные деньги (кассовая наличность). Наличие - присутствие, то, что имеется (наличие свободных мест).' },
  { id: 'r5-118', type: 'choice', q: 'В статье нет ни одного … о нашей школе.', o: ['упоминания', 'напоминания'], a: 0, ex: 'Упоминание - короткое называние кого-то или чего-то в речи, тексте (упоминание о школе). Напоминание - то, что помогает не забыть (напоминание о встрече).' },
  { id: 'r5-119', type: 'choice', q: 'Только … не здоровается со старшими.', o: ['невежда', 'невежа'], a: 1, ex: 'Невежа - грубый, невоспитанный человек (не поздоровался - невежа). Невежда - необразованный, мало знающий человек (невежда в математике).' },
  { id: 'r5-120', type: 'choice', q: 'Брат у меня …: ждать пять минут для него мучение.', o: ['нетерпеливый', 'нетерпимый'], a: 0, ex: 'Нетерпеливый - не умеющий ждать (нетерпеливый ребёнок). Нетерпимый - не допускающий чего-то, не терпящий чужого мнения (нетерпимый к недостаткам).' },
  { id: 'r5-121', type: 'choice', q: 'Фото получилось …: все с закрытыми глазами.', o: ['неудачливым', 'неудачным'], a: 1, ex: 'Неудачный - плохой по результату (неудачное фото, неудачный день). Неудачливый - о человеке, которому не везёт (неудачливый игрок).' },
  { id: 'r5-122', type: 'choice', q: 'Прокурор зачитал … заключение.', o: ['обвинительное', 'обвинённое'], a: 0, ex: 'Обвинительный - содержащий обвинение (обвинительное заключение, обвинительный приговор). Обвинённый - тот, кого обвинили (обвинённый в краже).' },
  { id: 'r5-123', type: 'choice', q: 'На классном часе мы … план поездки в музей.', o: ['осудили', 'обсудили'], a: 1, ex: 'Обсудить - поговорить о чём-то, разобрать вместе (обсудить план). Осудить - выразить неодобрение или вынести приговор (осудить поступок, осудить преступника).' },
  { id: 'r5-124', type: 'choice', q: 'Малыш крепко … маму за шею.', o: ['обхватил', 'охватил'], a: 0, ex: 'Обхватить - обнять, взять руками вокруг (обхватить за шею, обхватить ствол). Охватить - распространиться на что-то или о чувстве - овладеть (огонь охватил дом, охватила радость).' },
  { id: 'r5-125', type: 'choice', q: 'Врач … больному сладкое.', o: ['разграничил', 'ограничил'], a: 1, ex: 'Ограничить - поставить предел, уменьшить (ограничить сладкое, скорость). Разграничить - провести границу между чем-то, разделить (разграничить обязанности).' },
  { id: 'r5-126', type: 'choice', q: 'Колышками мы … свой участок от соседского.', o: ['отграничили', 'ограничили'], a: 0, ex: 'Отграничить - отделить границей одно от другого (отграничить участок от соседского). Ограничить - поставить предел (ограничить время).' },
  { id: 'r5-127', type: 'choice', q: 'Статья вызвала много … читателей.', o: ['окликов', 'откликов'], a: 1, ex: 'Отклик - ответ, реакция на что-то (отклики читателей). Оклик - обращение голосом, чтобы позвать (на оклик часового никто не ответил).' },
  { id: 'r5-128', type: 'choice', q: 'Канатоходец исполнил … трюк без страховки.', o: ['опасный', 'опасливый'], a: 0, ex: 'Опасный - способный причинить вред (опасный трюк, опасная дорога). Опасливый - осторожный, боязливый (опасливый взгляд, опасливый зверёк).' },
  { id: 'r5-129', type: 'choice', q: 'На уроке химии мы изучали … вещества.', o: ['органичные', 'органические'], a: 1, ex: 'Органический - относящийся к живым организмам, к химии углерода (органические вещества, удобрения). Органичный - естественный, гармонично вписанный (органичная игра актёра).' },
  { id: 'r5-130', type: 'choice', q: 'Наша команда прошла … тур чемпионата.', o: ['отборочный', 'отборный'], a: 0, ex: 'Отборочный - служащий для отбора лучших (отборочный тур, отборочная комиссия). Отборный - лучший, выбранный из многих (отборное зерно, отборные яблоки).' },
  { id: 'r5-131', type: 'choice', q: 'Его оштрафовали за … от уплаты налогов.', o: ['отклонение', 'уклонение'], a: 1, ex: 'Уклонение - избегание обязанности (уклонение от налогов, от службы). Отклонение - отход от нормы, курса или отказ (отклонение от маршрута, отклонение заявки).' },
  { id: 'r5-132', type: 'choice', q: 'Самолёт … от курса из-за сильного ветра.', o: ['отклонился', 'уклонился'], a: 0, ex: 'Отклониться - отойти в сторону от направления (отклониться от курса, от темы). Уклониться - избежать, увернуться (уклониться от удара, от ответа).' },
  { id: 'r5-133', type: 'choice', q: 'Из-за дальтонизма он плохо … красный и зелёный цвета.', o: ['отличает', 'различает'], a: 1, ex: 'Различать - видеть разницу, распознавать (различать цвета, различать красный и зелёный). Отличать - видеть отличие одного ОТ другого (отличать правду от лжи) или выделять кого-то (отличать лучших).' },
  { id: 'r5-134', type: 'choice', q: 'Брат окончил университет с …', o: ['отличием', 'различием'], a: 0, ex: 'Отличие - признак, который отделяет одно от другого, или знак заслуг (окончить с отличием, в отличие от). Различие - несходство, разница (различие во взглядах).' },
  { id: 'r5-135', type: 'choice', q: 'День выпускного станет для нас самым … днём.', o: ['памятливым', 'памятным'], a: 1, ex: 'Памятный - хорошо запомнившийся или служащий для памяти (памятный день, памятный подарок). Памятливый - с хорошей памятью (памятливый старик).' },
  { id: 'r5-136', type: 'choice', q: 'За три века здание … множество перестроек.', o: ['претерпело', 'перетерпело'], a: 0, ex: 'Претерпеть - испытать, подвергнуться чему-то (претерпеть изменения, лишения). Перетерпеть - вытерпеть до конца (перетерпеть боль, холод).' },
  { id: 'r5-137', type: 'choice', q: 'Из-за роста цен снизилась … способность населения.', o: ['покупательская', 'покупательная'], a: 1, ex: 'Покупательный - связанный с возможностью покупать (покупательная способность). Покупательский - относящийся к покупателям (покупательский интерес, покупательская корзина).' },
  { id: 'r5-138', type: 'choice', q: 'На столе стоял … торт из магазина, а не домашний.', o: ['покупной', 'покупательский'], a: 0, ex: 'Покупной - купленный, а не сделанный самому (покупной торт). Покупательский - относящийся к покупателям (покупательский интерес).' },
  { id: 'r5-139', type: 'choice', q: 'Объяснение учителя было простым и …', o: ['понятливым', 'понятным'], a: 1, ex: 'Понятный - доступный для понимания (понятное объяснение). Понятливый - быстро понимающий (понятливый ученик).' },
  { id: 'r5-140', type: 'choice', q: 'Эта песня стала очень … среди подростков.', o: ['популярной', 'популистской'], a: 0, ex: 'Популярный - известный и любимый многими (популярная песня) или доступный для всех (популярное изложение). Популистский - рассчитанный на дешёвую популярность, лёгкие обещания (популистские лозунги).' },
  { id: 'r5-141', type: 'choice', q: 'Спасти тонущего ребёнка - смелый …', o: ['проступок', 'поступок'], a: 1, ex: 'Поступок - любое действие человека (смелый поступок). Проступок - нарушение правил, небольшая вина (дисциплинарный проступок).' },
  { id: 'r5-142', type: 'choice', q: 'Ветерану вручили … грамоту.', o: ['почётную', 'почтительную'], a: 0, ex: 'Почётный - дающий почёт, уважение (почётная грамота, почётный гость). Почтительный - выражающий уважение, учтивый (почтительный поклон, тон).' },
  { id: 'r5-143', type: 'choice', q: 'Бабушка дожила до … возраста: ей девяносто лет.', o: ['почтительного', 'почтенного'], a: 1, ex: 'Почтенный - достойный уважения, обычно о пожилом человеке или возрасте (почтенный возраст). Почтительный - выражающий уважение к другим (почтительное отношение).' },
  { id: 'r5-144', type: 'choice', q: 'Мне надоели его … разговоры ни о чём.', o: ['праздные', 'праздничные'], a: 0, ex: 'Праздный - пустой, бесполезный или ничем не занятый (праздные разговоры, праздная жизнь). Праздничный - относящийся к празднику (праздничный стол).' },
  { id: 'r5-145', type: 'choice', q: 'Мой дедушка - высокий, … мужчина с седой бородой.', o: ['представительский', 'представительный'], a: 1, ex: 'Представительный - солидный, производящий хорошее впечатление (представительный мужчина) или состоящий из представителей (представительный орган). Представительский - предназначенный для официальных встреч (представительский автомобиль, представительские расходы).' },
  { id: 'r5-146', type: 'choice', q: 'Чехов - … мастер короткого рассказа.', o: ['признанный', 'признательный'], a: 0, ex: 'Признанный - получивший общее признание (признанный мастер). Признательный - благодарный (признательный за помощь).' },
  { id: 'r5-147', type: 'choice', q: 'Купюра оказалась …: на ней не было водяных знаков.', o: ['поделкой', 'подделкой'], a: 1, ex: 'Подделка - фальшивая вещь, сделанная под настоящую (подделка купюры, картины). Поделка - небольшая вещь, сделанная своими руками (поделка из шишек).' },
  { id: 'r5-148', type: 'choice', q: 'Котёнок опрокинул вазу, и все смеялись над его …', o: ['проделкой', 'поделкой'], a: 0, ex: 'Проделка - шалость, озорной поступок (проделки котёнка). Поделка - самодельная вещица (детская поделка).' },

  { id: 'fq-001', type: 'choice', q: 'Какой эпизод «Капитанской дочки» лучше всего доказывает, что добро возвращается?', o: ['Дуэль Гринёва со Швабриным', 'Маша едет к императрице', 'Гринёв дарит заячий тулуп вожатому в буран', 'Казнь коменданта Миронова'], a: 2, ex: 'Вожатый, которому Гринёв подарил тулуп, оказался Пугачёвым и потом пощадил Гринёва и помог спасти Машу. Это и есть «добро возвращается».' },
  { id: 'fq-002', type: 'choice', q: 'Найди ошибку в аргументе. «В романе Л. Н. Толстого „Преступление и наказание“ Раскольников убивает старуху-процентщицу, чтобы проверить свою теорию».', o: ['Ошибки нет', 'Неверен герой: старуху убил Свидригайлов', 'Неверна цель: он убил из ревности', 'Неверен автор: роман написал Ф. М. Достоевский'], a: 3, ex: 'Автор «Преступления и наказания» - Фёдор Михайлович Достоевский. Перепутанный автор - фактическая ошибка, проверяющий её обязательно заметит.' },
  { id: 'fq-003', type: 'choice', q: 'Что общего у Юшки (А. П. Платонов) и Матрёны (А. И. Солженицын)?', o: ['Оба бескорыстно помогают людям, а окружающие понимают их ценность только после их смерти', 'Оба погибают на войне', 'Оба мстят своим обидчикам', 'Оба в конце уезжают в город'], a: 0, ex: 'Юшка и Матрёна - тихие праведники: их обижают или не ценят, а после смерти становится ясно, что на таких людях всё держится. Хорошая пара аргументов к темам о доброте и о равнодушии.' },
  { id: 'fq-004', type: 'choice', q: 'Какое произведение НЕ подходит к теме «Чему человек может научиться у природы?»', o: ['«Прощание с Матёрой» В. Г. Распутина', '«Война и мир» Л. Н. Толстого (старый дуб)', '«Недоросль» Д. И. Фонвизина', '«Маленький принц» А. де Сент-Экзюпери (баобабы)'], a: 2, ex: '«Недоросль» - о воспитании и о власти помещиков, природы там нет. Дуб у Толстого, баобабы у Сент-Экзюпери и царский листвень у Распутина - готовые примеры о природе.' },
  { id: 'fq-005', type: 'choice', q: 'Как правильно написать имя автора «Маленького принца»?', o: ['Антуан де Сент Экзюпери', 'Антуан де Сент-Экзюпери', 'Антуан Де-Сент-Экзюпери', 'Антуан де Сен-Экзюпери'], a: 1, ex: 'Сент-Экзюпери - через дефис, «де» - с маленькой буквы и отдельно: Антуан де Сент-Экзюпери.' },
  { id: 'fq-006', type: 'choice', q: 'Аргумент 1: Юшка всю жизнь тайно отдавал деньги сироте. Аргумент 2: Лука в пьесе «На дне» утешает людей словами, но после его ухода никто не спасся. Какая связка между ними логичнее?', o: ['«Кроме того, Лука тоже добрый.»', '«Иначе понимает доброту герой Горького: если Юшка помогает делом, то Лука - только словами.»', '«Во-вторых, в пьесе тоже есть бедные люди.»', '«Таким образом, все герои одинаковы.»'], a: 1, ex: 'Хорошая связка показывает, как аргументы связаны по смыслу: здесь - противопоставление (доброта делом и доброта словами). «Кроме того» и «во-вторых» просто перечисляют - за логику так баллов не получить.' },
  { id: 'fq-007', type: 'choice', q: 'Какой эпизод «Судьбы человека» доказывает, что человек может сохранить достоинство даже перед лицом смерти?', o: ['Встреча с Ванюшкой у чайной', 'Рассказ о довоенной семье', 'Работа шофёром после войны', 'Отказ пить за победу немецкого оружия перед Мюллером'], a: 3, ex: 'Голодный пленный Соколов отказывается пить за победу немцев и пьёт «за свою погибель», не закусывая. Даже враг его зауважал и отпустил.' },
  { id: 'fq-008', type: 'choice', q: 'Найди ошибку в аргументе. «В повести Н. В. Гоголя „Шинель“ Акакий Акакиевич копит на новую шинель, но её отнимает значительное лицо».', o: ['Ошибки нет', 'Шинель снимают грабители, а значительное лицо только накричало на героя, когда он пришёл за помощью', 'Шинель он не копил, а получил в подарок', 'Повесть написал А. С. Пушкин'], a: 1, ex: 'Шинель сняли грабители на улице. «Значительное лицо» - генерал, к которому Акакий Акакиевич пришёл за помощью и который на него накричал.' },
  { id: 'fq-009', type: 'choice', q: 'Что общего у Ларры («Старуха Изергиль») и Печорина («Герой нашего времени»)?', o: ['Оба бескорыстно служат людям', 'Оба погибают на дуэли', 'Оба горды, живут для себя и в итоге одиноки', 'Оба - «маленькие люди»'], a: 2, ex: 'И Ларра, и Печорин ставят себя выше других, причиняют боль тем, кто рядом, и остаются одни. Пара подходит к темам о гордости, эгоизме и одиночестве.' },
  { id: 'fq-010', type: 'choice', q: 'Какое произведение НЕ подходит к теме «Память о Великой Отечественной войне - ответственность перед прошлым и будущим»?', o: ['«Судьба человека» М. А. Шолохова', '«А зори здесь тихие...» Б. Л. Васильева', '«Тарас Бульба» Н. В. Гоголя', '«Василий Тёркин» А. Т. Твардовского'], a: 2, ex: '«Тарас Бульба» - о войне запорожских казаков с поляками в далёком прошлом, а не о Великой Отечественной. Остальные три - о войне 1941-1945 годов.' },
  { id: 'fq-011', type: 'choice', q: 'Как зовут главную героиню рассказа А. И. Солженицына «Матрёнин двор»?', o: ['Матрёна Ивановна Григорьева', 'Марфа Васильевна Григорьева', 'Матрёна Васильевна Кабанова', 'Матрёна Васильевна Григорьева'], a: 3, ex: 'Матрёна Васильевна Григорьева. Кабанова - это фамилия героинь «Грозы» Островского, не перепутай.' },
  { id: 'fq-012', type: 'choice', q: 'Почему для темы «Что важнее для детей: советы родителей или их пример?» особенно удачен «Недоросль»?', o: ['Митрофан вырастает таким же грубым и жадным, как его мать: пример сильнее слов', 'Митрофан слушается советов Стародума и исправляется', 'Простакова даёт сыну мудрые советы', 'Митрофан уходит в армию и становится героем'], a: 0, ex: 'Простакова сама грубит, обманывает и бьёт слуг - и сын перенимает всё это. В финале он отталкивает и её: «Вот злонравия достойные плоды!»' },
  { id: 'fq-013', type: 'choice', q: 'Какой эпизод «Войны и мира» доказывает мысль Толстого о том, что подлинная красота - красота души?', o: ['Бородинское сражение', 'Лучистые глаза некрасивой княжны Марьи и внутренняя пустота красавицы Элен', 'Пожар Москвы', 'Совет в Филях'], a: 1, ex: 'Толстой противопоставляет Элен (красива, но пуста) и княжну Марью (некрасива, но её глаза светятся добротой). Подходит к теме «Близки ли Вам представления автора романа „Война и мир“ о подлинной красоте человека?»' },
  { id: 'fq-014', type: 'choice', q: 'Найди ошибку в аргументе. «Катерина из драмы А. Н. Островского „Гроза“, не выдержав жизни в доме свекрови, бросается в Неву».', o: ['Ошибки нет', 'Драму написал А. П. Чехов', 'Катерина бросается в Волгу, а не в Неву', 'Катерина уезжает с Борисом в Сибирь'], a: 2, ex: 'Действие «Грозы» - в городе Калинове на Волге. Катерина бросается в Волгу. Борис уезжает в Сибирь один, по воле дяди.' },
  { id: 'fq-015', type: 'choice', q: 'Что общего у Понтия Пилата («Мастер и Маргарита») и Онегина в истории с дуэлью?', o: ['Оба поступают против совести из страха: Пилат - за власть, Онегин - перед мнением общества', 'Оба спасают невинного человека', 'Оба - писатели', 'Оба потом счастливы'], a: 0, ex: 'Пилат знает, что Иешуа невиновен, но утверждает казнь; Онегин знает, что виноват перед Ленским, но выходит стреляться из страха перед «общественным мненьем». Пара для тем о совести, страхе и свободе выбора.' },
  { id: 'fq-016', type: 'choice', q: 'Какое произведение НЕ подходит к теме «В чём заключается нравственная ответственность учёного за результаты своей деятельности?»', o: ['«Собачье сердце» М. А. Булгакова', '«Отцы и дети» И. С. Тургенева (Базаров-естественник)', '«Бедная Лиза» Н. М. Карамзина', '«Прощание с Матёрой» В. Г. Распутина (стройка ГЭС)'], a: 2, ex: '«Бедная Лиза» - о любви и предательстве, науки там нет. Самый сильный аргумент к этой теме - профессор Преображенский из «Собачьего сердца».' },
  { id: 'fq-017', type: 'choice', q: 'Как правильно: главный герой «Горя от ума»?', o: ['Андрей Александрович Чацкий', 'Александр Андреевич Чацкий', 'Александр Андреевич Чатский', 'Алексей Андреевич Чацкий'], a: 1, ex: 'Александр Андреевич Чацкий. Фамилия пишется через «ц». Автор - тоже Александр: Александр Сергеевич Грибоедов.' },
  { id: 'fq-018', type: 'choice', q: 'Тема «Как становятся героями на войне?». Аргумент 1 - Андрей Соколов («Судьба человека»). Какая связка логична для перехода к «А зори здесь тихие...»?', o: ['«Однако есть и другая точка зрения: героев не бывает.»', '«Ту же мысль - героями становятся обычные люди - подтверждает повесть Б. Л. Васильева.»', '«Также в литературе есть много книг о войне.»', '«Совсем по-другому живут герои „Обломова“.»'], a: 1, ex: 'Связка должна называть общую мысль двух аргументов. Шофёр Соколов и пятеро девушек-зенитчиц - обычные люди, которые стали героями. Это и есть «ту же мысль подтверждает».' },
  { id: 'fq-019', type: 'choice', q: 'Какой эпизод «Преступления и наказания» доказывает, что муки совести наказывают сильнее суда?', o: ['Раскольников падает в обморок в полицейской конторе и потом возвращается в квартиру убитой', 'Раскольников отдаёт последние деньги семье Мармеладовых', 'Разумихин заботится о сестре Раскольникова', 'Лужин клевещет на Соню'], a: 0, ex: 'Улик почти нет, но Раскольников сам себя выдаёт: обморок, бред, возвращение на место преступления. Наказание началось внутри задолго до каторги.' },
  { id: 'fq-020', type: 'choice', q: 'Найди ошибку в аргументе. «В „Капитанской дочке“ Швабрин спасает Машу от Пугачёва».', o: ['Ошибки нет', 'Машу спасает Савельич', 'Маша сама бежит из крепости', 'Наоборот: Швабрин держал Машу взаперти, а освободил её Пугачёв по просьбе Гринёва'], a: 3, ex: 'Швабрин - предатель: перешёл к Пугачёву и держал Машу под замком, принуждая выйти за него. Пугачёв, узнав об этом от Гринёва, освободил её.' },
  { id: 'fq-021', type: 'choice', q: 'Что общего у Самсона Вырина («Станционный смотритель») и Акакия Акакиевича («Шинель»)?', o: ['Оба - «маленькие люди», к горю которых общество равнодушно', 'Оба - богатые помещики', 'Оба погибают на войне', 'Оба - учителя'], a: 0, ex: 'Бедные, беззащитные, их выгоняют и на них кричат, а после потери (дочери, шинели) оба умирают от горя. Это тема «маленького человека» - для тем о равнодушии и сострадании.' },
  { id: 'fq-022', type: 'choice', q: 'К какой теме лучше всего подходит легенда о Данко?', o: ['Что такое мудрая родительская любовь?', 'Как Вы думаете, почему говорят, что из всех нитей, связывающих человека с Родиной, самая крепкая - это родной язык?', 'Трудно или легко, на Ваш взгляд, делать добро?', 'Какие опасности таит в себе технический прогресс?'], a: 2, ex: 'Данко отдаёт сердце людям, которые его же упрекали. Делать добро трудно: нужно пожертвовать собой и не ждать благодарности.' },
  { id: 'fq-023', type: 'choice', q: 'Как правильно: автор романа «Обломов»?', o: ['Иван Андреевич Гончаров', 'Иван Сергеевич Гончаров', 'Иван Александрович Гончаров', 'Иван Алексеевич Гончаров'], a: 2, ex: 'Иван Александрович Гончаров. Ловушки: Иван Андреевич - это Крылов, Иван Сергеевич - Тургенев, Иван Алексеевич - Бунин.' },
  { id: 'fq-024', type: 'choice', q: 'Какое утверждение о «Матрёнином дворе» ВЕРНО?', o: ['Матрёну убивает Фаддей топором', 'Матрёна погибает на железнодорожном переезде, когда перевозят брёвна её горницы', 'Матрёна уезжает к Кире в город', 'Матрёна погибает на войне'], a: 1, ex: 'Матрёна сама помогала везти брёвна горницы, которую отдала Кире, и погибла под поездом на переезде. Фаддей только грозился когда-то «порубить» её и Ефима.' },
  { id: 'fq-025', type: 'choice', q: 'Найди ошибку в аргументе. «В „Маленьком принце“ Роза говорит: „Ты навсегда в ответе за всех, кого приручил“».', o: ['Ошибки нет', 'Эти слова говорит Лис', 'Эти слова говорит Змея', 'Эти слова говорит лётчик'], a: 1, ex: 'Эту тайну Маленькому принцу открывает Лис, вместе со словами «Зорко одно лишь сердце».' },
  { id: 'fq-026', type: 'choice', q: 'Какой герой НЕ подходит к теме «Почему гордые люди часто бывают одинокими?»', o: ['Ларра («Старуха Изергиль»)', 'Печорин («Герой нашего времени»)', 'Юшка («Юшка»)', 'Евгений Онегин'], a: 2, ex: 'Юшка - полная противоположность гордецу: он смиренный и добрый. Ларра, Печорин и Онегин ставят себя выше других и остаются одни.' },
  { id: 'fq-027', type: 'choice', q: 'Что доказывает финал «Недоросля», где Митрофан отталкивает мать?', o: ['Что Простакова была строгой, но справедливой', 'Что слепая любовь без нравственного воспитания оборачивается против самих родителей', 'Что Митрофан стал умнее', 'Что Стародум ошибся'], a: 1, ex: 'Простакова всё позволяла сыну и учила его грубости - и, когда она потеряла власть, сын бросил и её. Стародум говорит: «Вот злонравия достойные плоды!»' },
  { id: 'fq-028', type: 'choice', q: 'Как правильно: имя героя «Собачьего сердца» после операции?', o: ['Полиграф Полиграфович Шариков', 'Поллиграф Поллиграфович Шариков', 'Полиграф Филиппович Шариков', 'Полиграф Полиграфович Шарыков'], a: 0, ex: 'Полиграф Полиграфович Шариков. Филиппович - отчество профессора: Филипп Филиппович Преображенский.' },
  { id: 'fq-029', type: 'choice', q: 'Какой эпизод «Мастера и Маргариты» лучше всего подходит к теме «Свобода и ответственность в жизни человека»?', o: ['Маргарита летает над ночной Москвой', 'Воланд даёт сеанс чёрной магии в Варьете', 'Кот Бегемот играет с Воландом в шахматы', 'Пилат мог отпустить Иешуа, но из страха утвердил казнь и потом мучился совестью'], a: 3, ex: 'У Пилата была власть и свобода выбора, и он отвечает за свой выбор почти две тысячи лет. Остальные эпизоды яркие, но тему не доказывают.' },
  { id: 'fq-030', type: 'choice', q: 'Найди ошибку в аргументе. «Андрей Соколов узнаёт, что его сын Анатолий погиб 9 мая 1945 года, и усыновляет девочку-сироту».', o: ['Ошибки нет', 'Соколов усыновил мальчика Ванюшку, а не девочку', 'Сына Соколова звали Иван', 'Сын погиб в 1941 году'], a: 1, ex: 'Соколов взял к себе мальчика-сироту Ванюшку. Сын Анатолий действительно погиб 9 мая 1945 года от пули снайпера.' },
  { id: 'fq-031', type: 'choice', q: 'Что общего у Сони Мармеладовой и Маргариты?', o: ['Обе ради любви готовы на жертву и помогают любимому человеку спастись', 'Обе - дочери богатых помещиков', 'Обе живут в Москве XIX века', 'Обе предают своих любимых'], a: 0, ex: 'Соня едет за Раскольниковым на каторгу, Маргарита идёт на бал к сатане, чтобы вернуть Мастера. Пара для тем о любви, жертвенности и добре.' },
  { id: 'fq-032', type: 'choice', q: 'Какое произведение НЕ подходит к теме «Как избежать конфликта между „отцами“ и „детьми“?»', o: ['«Отцы и дети» И. С. Тургенева', '«Тарас Бульба» Н. В. Гоголя', '«Гроза» А. Н. Островского', '«Гранатовый браслет» А. И. Куприна'], a: 3, ex: '«Гранатовый браслет» - о любви, конфликта поколений там нет. У Тургенева - спор Базарова и Павла Петровича, у Гоголя - Тарас и Андрий, у Островского - Кабаниха и Тихон с Катериной.' },
  { id: 'fq-033', type: 'choice', q: 'Как правильно: автор драмы «Гроза»?', o: ['Александр Николаевич Островский', 'Николай Александрович Островский', 'Александр Николаевич Островской', 'Александр Сергеевич Островский'], a: 0, ex: 'Александр Николаевич Островский. Есть и другой писатель - Николай Алексеевич Островский («Как закалялась сталь»), не перепутай.' },
  { id: 'fq-034', type: 'choice', q: 'Какой эпизод «Отцов и детей» опровергает убеждение Базарова, что любовь - чепуха?', o: ['Спор с Павлом Петровичем за чаем', 'Любовь Базарова к Одинцовой и её отказ', 'Опыты с лягушками', 'Приезд в имение Кирсановых'], a: 1, ex: 'Базаров, отрицавший любовь, сам страстно влюбляется и страдает. Жизнь оказалась сильнее его теории - аргумент к темам о чувствах и познании себя.' },
  { id: 'fq-035', type: 'choice', q: 'Найди ошибку в аргументе. «Вера Шеина получает в подарок жемчужное ожерелье от князя Желткова».', o: ['Ошибки нет', 'Подарок прислал генерал Аносов', 'Подарок - гранатовый браслет, а Желтков - мелкий чиновник, а не князь', 'Подарок - кольцо от мужа'], a: 2, ex: 'Желтков - бедный мелкий чиновник, он прислал гранатовый браслет. Князь в повести - муж Веры, Василий Львович Шеин.' },
  { id: 'fq-036', type: 'choice', q: 'Тезис сочинения: «Доброта бывает разной». Какое заключение лучше всего возвращает к тезису?', o: ['«Подводя итог, скажу: доброта Юшки - в делах, а Луки - в словах; настоящая доброта помогает человеку жить, а не только утешает.»', '«В заключение скажу, что мне понравились обе книги.»', '«Итак, Горький жил в двадцатом веке.»', '«В заключение: Юшка был помощником кузнеца.»'], a: 0, ex: 'Заключение отвечает на вопрос темы и опирается на аргументы. «Мне понравились книги» и пересказ фактов - не вывод.' },
  { id: 'fq-037', type: 'choice', q: 'Какой эпизод «Горя от ума» доказывает, что общество не ценит умного человека?', o: ['Молчалин хвалит шпица гостьи', 'Фамусов мечтает о зяте-полковнике', 'Скалозуб рассказывает о службе', 'Гости с радостью подхватывают слух о сумасшествии Чацкого'], a: 3, ex: 'Обществу проще объявить Чацкого сумасшедшим, чем спорить с его правдой. Аргумент к теме «Всегда ли общество ценит достойных людей?»' },
  { id: 'fq-038', type: 'choice', q: 'Что общего у Обломова и Митрофанушки?', o: ['Обоих испортило воспитание, при котором за них всё делали другие', 'Оба стали великими учёными', 'Оба погибли на дуэли', 'Оба - крестьяне'], a: 0, ex: 'Илюшу в Обломовке и Митрофана в имении Простаковых оберегали от любого труда. Пара для тем о влиянии семьи на личность.' },
  { id: 'fq-039', type: 'choice', q: 'К какой теме лучше всего подходит стихотворение в прозе И. С. Тургенева «Русский язык»?', o: ['Что такое мудрая родительская любовь?', 'Почему язык называют величайшим достоянием, богатством народа?', 'Чем опасно равнодушие?', 'Человек науки - каким он должен быть?'], a: 1, ex: 'Тургенев называет язык «великим, могучим, правдивым и свободным» и говорит, что такой язык мог быть дан только великому народу.' },
  { id: 'fq-040', type: 'choice', q: 'Найди ошибку в аргументе. «Тарас Бульба убивает старшего сына Остапа за измену».', o: ['Ошибки нет', 'Тарас убивает младшего сына Андрия, а Остапа казнят поляки в Варшаве', 'Тарас прощает Андрия', 'Остап переходит к полякам'], a: 1, ex: 'Предал своих младший - Андрий, и Тарас убил его сам. Старший, Остап, попал в плен и мужественно принял казнь.' },
  { id: 'fq-041', type: 'choice', q: 'Почему «Станционного смотрителя» можно взять для темы «Что такое раскаяние?»', o: ['Дуня приезжает на могилу отца и долго лежит на ней: раскаяние пришло, когда отца уже не было в живых', 'Вырин раскаивается, что отправил Дуню учиться', 'Минский отдаёт Вырину своё имение', 'Рассказчик раскаивается, что опоздал на станцию'], a: 0, ex: 'Дуня поняла свою вину слишком поздно. Вывод: раскаяние может опоздать, ценить родителей нужно, пока они рядом.' },
  { id: 'fq-042', type: 'choice', q: 'Кто из героев «Войны и мира» помогает Пьеру в плену понять, как жить просто?', o: ['Анатоль Курагин', 'Николай Ростов', 'Платон Каратаев', 'Наполеон'], a: 2, ex: 'Простой солдат Платон Каратаев - с ним Пьер встретился в плену и научился радоваться простой жизни.' },
  { id: 'fq-043', type: 'choice', q: 'Найди ошибку в аргументе. «В рассказе М. Горького „Старуха Изергиль“ Данко вырывает сердце, чтобы отомстить людям, которые его упрекали».', o: ['Ошибки нет', 'Данко вырывает сердце не из мести, а чтобы осветить людям путь из леса', 'Сердце вырывает Ларра', 'Это легенда из пьесы «На дне»'], a: 1, ex: 'Данко любит людей и спасает их, хотя они его упрекают и готовы на него наброситься. Его подвиг - жизнь для других, а не месть.' },
  { id: 'fq-044', type: 'choice', q: 'Какой эпизод «Гранатового браслета» подходит к теме «Способно ли явление культуры изменить взгляды человека на жизнь?»', o: ['Вера слушает сонату Бетховена и понимает, какую любовь потеряла', 'Именины Веры на даче', 'Разговор Николая с Желтковым', 'Генерал Аносов рассказывает о войне'], a: 0, ex: 'Музыка открывает Вере то, чего она не понимала: подлинную любовь Желткова. Это пример того, как искусство меняет человека.' },
  { id: 'fq-045', type: 'choice', q: 'Какой эпизод «Героя нашего времени» доказывает, что ложный стыд толкает на подлость?', o: ['Похищение Бэлы', 'Заговор Грушницкого: на дуэли пистолет Печорина должен быть незаряженным', 'Встреча с Максимом Максимычем', 'Вулич стреляет себе в голову'], a: 1, ex: 'Грушницкий боится показаться смешным и трусом и соглашается на подлый заговор. Даже узнав, что Печорин всё знает, он не находит сил признаться.' },
  { id: 'fq-046', type: 'choice', q: 'Найди ошибку в аргументе. «Обломов женится на Ольге Ильинской, и она его перевоспитывает».', o: ['Ошибки нет', 'Обломов и Ольга расстаются: Ольга выходит за Штольца, а Обломов женится на Агафье Пшеницыной', 'Обломов женится на Агафье, а Ольга уходит в монастырь', 'Обломов уезжает со Штольцем за границу и становится деловым человеком'], a: 1, ex: 'Обломов испугался перемен, и они с Ольгой расстались. Его женой стала заботливая вдова Агафья Матвеевна Пшеницына.' },
  { id: 'fq-047', type: 'choice', q: 'Как правильно: автор «Судьбы человека» и «Тихого Дона»?', o: ['Михаил Афанасьевич Шолохов', 'Михаил Андреевич Шолохов', 'Михаил Александрович Шолохов', 'Михаил Алексеевич Шолохов'], a: 2, ex: 'Михаил Александрович Шолохов. Михаил Афанасьевич - это Булгаков: два Михаила, не путай отчества.' },
  { id: 'fq-048', type: 'choice', q: 'Какой аргумент лучше всего подходит к теме «Человек - хозяин природы или её часть?»', o: ['«Прощание с Матёрой»: царский листвень не могут ни срубить, ни сжечь', '«Горе от ума»: Чацкий спорит с Фамусовым', '«Шинель»: чиновника грабят на улице', '«Недоросль»: Митрофан не хочет учиться'], a: 0, ex: 'Лиственница, которую не берут ни топор, ни огонь, показывает: природа сильнее самоуверенности человека.' },
  { id: 'fq-049', type: 'choice', q: 'Найди ошибку в аргументе. «Лопахин в „Вишнёвом саде“ покупает имение, чтобы спасти сад от вырубки».', o: ['Ошибки нет', 'Лопахин покупает имение и сам начинает рубить сад, чтобы сдать землю под дачи', 'Сад покупает Гаев', 'Сад покупает Петя Трофимов'], a: 1, ex: 'Лопахин с самого начала предлагал вырубить сад под дачи и, купив имение, так и делает. В финале слышен стук топора.' },
  { id: 'fq-050', type: 'choice', q: 'Тема «Чем опасно равнодушие?». Какой тезис лучше?', o: ['Равнодушие - это когда человек равнодушен.', 'Я люблю читать книги о природе.', 'Равнодушие опасно тем, что убивает незаметно: человеку, которого никто не пожалел, некуда пойти за помощью.', 'Равнодушие не опасно, потому что так живут все.'], a: 2, ex: 'Тезис - прямой ответ на вопрос темы, который потом доказывают аргументы (например, «Шинель» и «Юшка»). Первый вариант ничего не объясняет, второй - не по теме.' },

  { id: 'fq-052', type: 'choice', q: 'Какой аргумент подходит к теме «Разделяете ли Вы мнение о том, что речевая культура человека - зеркало его духовной культуры?»', o: ['«Судьба человека»: Соколов в плену', '«Бедная Лиза»: пруд у Симонова монастыря', '«А зори здесь тихие...»: бой с диверсантами', '«Собачье сердце»: грубая речь Шарикова выдаёт его хамство'], a: 3, ex: 'Шариков сыплет руганью и чужими лозунгами - по речи сразу видно, что внутри пусто. Ещё подходят Простакова и Стародум из «Недоросля».' },

  { id: 'fq-055', type: 'choice', q: 'Найди ошибку в аргументе. «В романе „Евгений Онегин“ Онегин убивает на дуэли Грушницкого».', o: ['Ошибки нет', 'Онегин убивает Ленского, а Грушницкого убивает Печорин в «Герое нашего времени»', 'Онегин убивает Ленского и Грушницкого', 'Онегина убивает Ленский'], a: 1, ex: 'Две знаменитые дуэли: Онегин - Ленский (Пушкин) и Печорин - Грушницкий (Лермонтов). Не перепутай.' },

  { id: 'fq-057', type: 'choice', q: 'Что общего у Митрофана («Недоросль») и Чичикова («Мёртвые души»)?', o: ['Оба выросли на родительских уроках, в которых не было нравственности', 'Оба мечтают стать учёными', 'Оба воюют с Наполеоном', 'Оба бескорыстно помогают людям'], a: 0, ex: 'Митрофан перенял грубость и жадность матери, Чичиков всю жизнь следует совету отца беречь и копить копейку. Пара для тем о советах и примере родителей.' },
  { id: 'fq-058', type: 'choice', q: 'Найди ошибку в аргументе. «В романе М. А. Шолохова „Тихий Дон“ Григорий Мелехов в конце уезжает с Аксиньей в Москву и начинает новую жизнь».', o: ['Ошибки нет', 'Аксинья погибает в пути, а Григорий возвращается на родной хутор к сыну', 'Григорий погибает в бою вместе с Аксиньей', 'Роман написал М. А. Булгаков'], a: 1, ex: 'При побеге Аксинью убивает пуля. Григорий хоронит её, потом бросает оружие в Дон и возвращается домой, где у него остался сын.' },

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
/* читать легче: слова с ударной буквой (бралА), слова в «кавычках» и короткая подпись перед двоеточием - жирным */

/* ================= тренировка ================= */
let ses = null;
/* ---- тренировка и пробник не пропадают: копия ses лежит в state.ses (localStorage + облако) после старта, ответа и перехода ----
   Обычный конец (итог, «Закончить», «На главную») - state.ses = null. Свежая (меньше 3 часов) открывается сама на том же месте,
   старая - карточкой «Не закончено» первой на главной. sid - номер тренировки: по нему узнаём её копию с другого устройства. */
const SES_KEEP = ['sid', 'title', 'pool', 'n', 'ids', 'i', 'okN', 'got', 'newErr', 'phase', 'sel', 'msel', 'last', 'mock', 'mockKind', 'score', 'max', 'marathon', 'saved', 'drill', 'rq', 'favs', 'key', 'rest', 'mix', 'skip'];
const SES_FRESH = 3 * 3600e3;
let touched = false; // она уже что-то нажала - сами никуда не перебрасываем
const sesLive = () => !!ses && Array.isArray(ses.ids) && ses.i < ses.ids.length;
function sesStore() {
  if (!sesLive()) { state.ses = null; return; }
  const c = {}; for (const k of SES_KEEP) if (ses[k] !== undefined) c[k] = ses[k];
  if (Array.isArray(c.pool) && c.pool.length > 600) delete c.pool; // большой пул не храним: для «Начать заново» хватит заданий тренировки
  c.at = Date.now();
  state.ses = JSON.parse(JSON.stringify(c));
}
function sesSave() { sesStore(); save(); }
/* копия из state.ses -> рабочая тренировка; задания, которых больше нет, пропускаем */
function sesRestore(x) {
  if (!x || !Array.isArray(x.ids) || !x.ids.length) return null;
  const at = Math.max(0, x.i || 0), ids = []; let i = 0, cur = false;
  x.ids.forEach((id, j) => { if (!getItem(id)) return; if (j < at) i++; if (j === at) cur = true; ids.push(id); });
  if (i >= ids.length) return null;
  const s = { pool: [], n: ids.length, okN: 0, got: 0, newErr: 0, score: 0, max: 0, sel: [], msel: {}, last: null, phase: 'q', ...JSON.parse(JSON.stringify(x)), ids, i };
  delete s.at;
  if (!s.sid) s.sid = uid();
  if (!Array.isArray(s.pool) || !s.pool.length) s.pool = [...new Set(ids)];
  if (!cur || s.phase !== 'fb' || !s.last) { s.phase = 'q'; s.last = null; if (!cur) { s.sel = []; s.msel = {}; } }
  if (!Array.isArray(s.sel)) s.sel = [];
